<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>CineStream - Gestor de Biblioteca</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#121318;color:#fff;margin:0;padding:20px}
.container{max-width:1050px;margin:0 auto}h1{color:#e50914}
.panel{background:#1c1e26;padding:20px;border-radius:8px;margin-bottom:25px;border:1px solid #2e323e}
.row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
input,select,button,textarea{padding:10px;border-radius:6px;border:1px solid #333;background:#0f1015;color:#fff;font:inherit}
input[type=text],input[type=email],input[type=password],textarea{flex:1;min-width:140px}
button{background:#e50914;border:none;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}
.sec{background:#2563eb}.warn{background:#d97706}.grey{background:#333}.red{background:#dc2626}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #2e323e;vertical-align:middle}
.tbl{overflow-x:auto}
.badge{padding:3px 8px;border-radius:4px;font-size:.8rem;font-weight:bold;white-space:nowrap}
.on{background:#065f46;color:#34d399}.off{background:#991b1b;color:#f87171}.idle{background:#333;color:#aaa}.vis{background:#1b5e20}.hid{background:#b71c1c}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;padding:10px;box-sizing:border-box}
.box{background:#1c1e26;padding:20px;border-radius:8px;width:520px;max-width:100%;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{font-size:.9rem;color:#fbbf24;margin-top:8px}small{color:#888}
#login{max-width:360px;margin:15vh auto}#app{display:none}
</style>
</head>
<body>

<div id="login" class="panel">
  <h2>🔐 Acceso al panel</h2>
  <div class="row"><input type="email" id="email" placeholder="Correo" autocomplete="username"></div>
  <div class="row"><input type="password" id="pass" placeholder="Contraseña" autocomplete="current-password"></div>
  <button id="btnLogin">Entrar</button>
  <div id="loginErr" class="msg"></div>
</div>

<div id="app" class="container">
  <div class="row" style="justify-content:space-between;align-items:center">
    <h1 style="margin:0">Panel de Control de Biblioteca</h1>
    <div><small id="who"></small> <button class="grey" id="btnLogout">Salir</button></div>
  </div>

  <div class="panel">
    <h3>Añadir título individual</h3>
    <div class="row">
      <input type="text" id="addTitle" placeholder="Título exacto">
      <input type="text" id="addYear" placeholder="Año (opcional)" style="max-width:130px;flex:none">
      <select id="addCategory"><option>Película</option><option>Serie</option><option>Documental</option></select>
    </div>
    <div class="row">
      <input type="text" id="addTags" placeholder="Etiquetas (ej: Favoritos, Acción, Maratón)">
      <input type="text" id="addUrl" placeholder="URL del vídeo (OK.RU, YouTube, Dailymotion, Rumble embed)">
      <button id="btnAdd">Guardar e inyectar TMDB</button>
    </div>
    <div id="addMsg" class="msg"></div>
  </div>

  <div class="panel">
    <h3>Carga masiva por lotes</h3>
    <p style="font-size:.85rem;color:#aaa">Una línea por título: <code>Título | URL | Categoría</code></p>
    <textarea id="batchInput" rows="4" style="width:100%;box-sizing:border-box" placeholder="Matrix | https://ok.ru/video/123456 | Película"></textarea>
    <button class="sec" id="btnBatch" style="margin-top:10px">Procesar lote</button>
    <div id="batchMsg" class="msg"></div>
  </div>

  <div class="panel">
    <h3>Mantenimiento y copias de seguridad</h3>
    <div class="row">
      <button class="warn" id="btnCheck">🔍 Verificar enlaces</button>
      <button class="sec" id="btnExport">📥 Exportar BBDD (JSON)</button>
      <button class="sec" id="btnImport">📤 Importar BBDD (JSON)</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
    <div id="maintMsg" class="msg"></div>
  </div>

  <div class="panel">
    <h3>Catálogo guardado</h3>
    <input type="text" id="searchInput" placeholder="Buscar por título, director o etiqueta..." style="width:100%;box-sizing:border-box;margin-bottom:15px">
    <div class="tbl"><table>
      <thead><tr><th>Portada</th><th>Título</th><th>Director</th><th>Enlace</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
  </div>
</div>

<div id="editModal" class="modal"><div class="box">
  <h3>Editar título</h3>
  <input type="text" id="eTitle" placeholder="Título">
  <select id="eCategory"><option>Película</option><option>Serie</option><option>Documental</option></select>
  <input type="text" id="eUrl" placeholder="URL del vídeo">
  <input type="text" id="eDirector" placeholder="Director">
  <input type="text" id="eYear" placeholder="Año">
  <input type="text" id="eGenres" placeholder="Géneros (separados por comas)">
  <input type="text" id="eTags" placeholder="Etiquetas (separadas por comas)">
  <input type="text" id="ePoster" placeholder="URL portada">
  <textarea id="eOverview" rows="4" placeholder="Sinopsis"></textarea>
  <button id="btnSaveEdit">Guardar cambios</button>
  <button class="grey" data-close="editModal">Cancelar</button>
</div></div>

<div id="epModal" class="modal"><div class="box">
  <h3 id="epHead">Episodios</h3>
  <div id="epList" style="display:flex;flex-direction:column;gap:8px"></div>
  <button class="sec" id="btnEpAdd">➕ Añadir episodio</button>
  <button id="btnEpSave">Guardar episodios</button>
  <button class="grey" data-close="epModal">Cancelar</button>
</div></div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBG9gTNx3DlYLWizwud5iS3grjCY_VJ4kY",authDomain:"mi-reproductor-privado.firebaseapp.com",
  projectId:"mi-reproductor-privado",storageBucket:"mi-reproductor-privado.firebasestorage.app",
  messagingSenderId:"221209265432",appId:"1:221209265432:web:bf751603f347acdbc70a6d"
});
const db=firebase.firestore(),auth=firebase.auth(),$=id=>document.getElementById(id);
const h=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);e.append(...k);return e};
const splitList=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
const millis=c=>c&&c.toMillis?c.toMillis():c&&c.seconds?c.seconds*1000:c?(new Date(c).getTime()||0):0;
const PH='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="60"><rect width="100%" height="100%" fill="#252833"/></svg>');
let movies=[],epMovie=null,epItems=[],editId=null;

/* ---------- Login ---------- */
auth.onAuthStateChanged(u=>{
  $('login').style.display=u?'none':'block';$('app').style.display=u?'block':'none';
  if(u){$('who').textContent=u.email;loadTable()}
});
$('btnLogin').onclick=()=>{
  $('loginErr').textContent='';
  auth.signInWithEmailAndPassword($('email').value.trim(),$('pass').value)
    .catch(e=>$('loginErr').textContent='No se pudo iniciar sesión ('+e.code+')');
};
$('pass').onkeydown=e=>{if(e.key==='Enter')$('btnLogin').click()};
$('btnLogout').onclick=()=>auth.signOut();

/* ---------- API propia (TMDB y comprobación de enlaces) ---------- */
async function api(path,params){
  const token=await auth.currentUser.getIdToken();
  const r=await fetch('/api/'+path+'?'+new URLSearchParams(params),{headers:{Authorization:'Bearer '+token}});
  if(!r.ok)throw new Error(path+' → HTTP '+r.status);
  return r.json();
}
async function enrich(title,category,year){
  try{return await api('tmdb',{title,category,...(year?{year}:{})})}catch(e){console.warn(e);return{}}
}
async function createTitle(title,url,category,tags,year){
  const meta=await enrich(title,category,year);
  return db.collection('movies').add({
    title,url,category,tags:tags||[],
    poster:meta.poster||'',overview:meta.overview||'',year:meta.year||year||'',
    director:meta.director||'Desconocido',cast:meta.cast||[],genres:meta.genres||[],ageRating:meta.ageRating||'',
    visible:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
}

/* ---------- Altas ---------- */
$('btnAdd').onclick=async()=>{
  const title=$('addTitle').value.trim(),url=$('addUrl').value.trim();
  if(!title||!url){$('addMsg').textContent='Falta el título o la URL.';return}
  const b=$('btnAdd');b.disabled=true;$('addMsg').textContent='Guardando…';
  try{
    await createTitle(title,url,$('addCategory').value,splitList($('addTags').value),$('addYear').value.trim());
    ['addTitle','addUrl','addTags','addYear'].forEach(i=>$(i).value='');
    $('addMsg').textContent='✅ Añadido.';await loadTable();
  }catch(e){$('addMsg').textContent='Error: '+e.message}
  b.disabled=false;
};
$('btnBatch').onclick=async()=>{
  const lines=$('batchInput').value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return;
  const b=$('btnBatch');b.disabled=true;let ok=0;const errs=[];
  for(const [i,l] of lines.entries()){
    const [title,url,cat]=l.split('|').map(s=>s.trim());
    $('batchMsg').textContent=`Procesando ${i+1}/${lines.length}…`;
    if(!title||!url){errs.push('Línea '+(i+1)+': formato incorrecto');continue}
    try{await createTitle(title,url,['Película','Serie','Documental'].includes(cat)?cat:'Película',[]);ok++}
    catch(e){errs.push('Línea '+(i+1)+': '+e.message)}
  }
  $('batchMsg').textContent=`✅ ${ok} añadidos.`+(errs.length?' ⚠ '+errs.join(' · '):'');
  if(!errs.length)$('batchInput').value='';
  b.disabled=false;loadTable();
};

/* ---------- Tabla ---------- */
async function loadTable(){
  const snap=await db.collection('movies').get();
  movies=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>millis(b.createdAt)-millis(a.createdAt));
  const tb=$('tbody');tb.replaceChildren();
  movies.forEach(m=>{
    const vis=m.visible!==false,eps=(m.episodes||[]).length;
    const img=h('img',{src:m.poster||PH,alt:'',style:'width:40px;height:60px;object-fit:cover'});
    img.onerror=()=>{img.onerror=null;img.src=PH};
    const act=h('td',{},
      ...(m.category==='Serie'?[h('button',{className:'sec',textContent:'📺 '+eps,title:'Episodios',onclick:()=>openEpisodes(m)})]:[]),
      h('button',{className:'grey',textContent:'✏️',title:'Editar',onclick:()=>openEdit(m)}),
      h('button',{className:'grey',textContent:vis?'Ocultar':'Mostrar',onclick:()=>db.collection('movies').doc(m.id).update({visible:!vis}).then(loadTable)}),
      h('button',{className:'red',textContent:'Borrar',onclick:()=>{if(confirm('¿Eliminar "'+m.title+'"?'))db.collection('movies').doc(m.id).delete().then(loadTable)}})
    );
    act.style.cssText='display:flex;gap:4px;flex-wrap:wrap';
    const tr=h('tr',{},
      h('td',{},img),
      h('td',{},h('strong',{textContent:m.title||''}),h('br'),h('small',{textContent:[m.category,...(m.tags||[])].join(' · ')})),
      h('td',{textContent:m.director||'Sin datos'}),
      h('td',{},h('span',{id:'ls-'+m.id,className:'badge idle',textContent:'Sin comprobar'})),
      h('td',{},h('span',{className:'badge '+(vis?'vis':'hid'),textContent:vis?'Visible':'Oculta'})),
      act);
    tr.dataset.search=[m.title,m.director,...(m.tags||[])].join(' ').toLowerCase();
    tb.append(tr);
  });
  filterTable();
}
function filterTable(){
  const q=$('searchInput').value.toLowerCase().trim();
  [...$('tbody').rows].forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none');
}
$('searchInput').oninput=filterTable;

/* ---------- Edición ---------- */
function openEdit(m){
  editId=m.id;
  $('eTitle').value=m.title||'';$('eCategory').value=m.category||'Película';$('eUrl').value=m.url||'';
  $('eDirector').value=m.director||'';$('eYear').value=m.year||'';$('eGenres').value=(m.genres||[]).join(', ');
  $('eTags').value=(m.tags||[]).join(', ');$('ePoster').value=m.poster||'';$('eOverview').value=m.overview||'';
  $('editModal').style.display='flex';
}
$('btnSaveEdit').onclick=()=>{
  db.collection('movies').doc(editId).update({
    title:$('eTitle').value.trim(),category:$('eCategory').value,url:$('eUrl').value.trim(),
    director:$('eDirector').value.trim(),year:$('eYear').value.trim(),genres:splitList($('eGenres').value),
    tags:splitList($('eTags').value),poster:$('ePoster').value.trim(),overview:$('eOverview').value
  }).then(()=>{$('editModal').style.display='none';loadTable()}).catch(e=>alert('Error: '+e.message));
};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).style.display='none');

/* ---------- Episodios ---------- */
function openEpisodes(m){
  epMovie=m;epItems=(m.episodes||[]).map(e=>({...e}));
  $('epHead').textContent='Episodios · '+m.title;renderEps();$('epModal').style.display='flex';
}
function renderEps(){
  $('epList').replaceChildren(...epItems.map((e,i)=>{
    const t=h('input',{type:'text',value:e.title||'',placeholder:'1x01 - Título',oninput:()=>e.title=t.value});
    const u=h('input',{type:'text',value:e.url||'',placeholder:'URL del vídeo',oninput:()=>e.url=u.value});
    return h('div',{className:'row',style:'margin:0;flex-wrap:nowrap'},t,u,
      h('button',{className:'red',textContent:'✕',onclick:()=>{epItems.splice(i,1);renderEps()}}));
  }));
}
$('btnEpAdd').onclick=()=>{epItems.push({title:'',url:''});renderEps()};
$('btnEpSave').onclick=()=>{
  const clean=epItems.filter(e=>e.url&&e.url.trim()).map((e,i)=>({
    title:(e.title||'').trim()||'Episodio '+(i+1),url:e.url.trim(),addedAt:e.addedAt||new Date().toISOString()
  }));
  db.collection('movies').doc(epMovie.id).update({episodes:clean})
    .then(()=>{$('epModal').style.display='none';loadTable()}).catch(e=>alert('Error: '+e.message));
};

/* ---------- Comprobación de enlaces (bajo demanda, 3 a la vez) ---------- */
async function checkMovie(m){
  const badge=$('ls-'+m.id);if(!badge)return;
  const urls=(m.episodes&&m.episodes.length)?m.episodes.map(e=>e.url):[m.url];
  badge.className='badge idle';badge.textContent='Comprobando…';
  const res=[];
  for(const u of urls){
    if(!u){res.push({ok:false,reason:'Sin URL'});continue}
    try{res.push(await api('check',{url:u}))}catch(e){res.push({ok:false,reason:e.message})}
  }
  const bad=res.filter(r=>!r.ok);
  badge.className='badge '+(bad.length?'off':'on');
  badge.textContent=bad.length?`🔴 ${bad.length}/${res.length} caídos`:'🟢 Online';
  badge.title=bad.map(b=>b.reason).join(' · ');
}
$('btnCheck').onclick=async()=>{
  const b=$('btnCheck');b.disabled=true;let done=0;const queue=[...movies];
  const worker=async()=>{while(queue.length){await checkMovie(queue.shift());$('maintMsg').textContent=`Verificando ${++done}/${movies.length}…`}};
  await Promise.all([worker(),worker(),worker()]);
  $('maintMsg').textContent='Revisión completa. Pasa el ratón por un 🔴 para ver el motivo (OK.RU es heurístico).';
  b.disabled=false;
};

/* ---------- Backup (conserva IDs y fechas) ---------- */
$('btnExport').onclick=async()=>{
  const snap=await db.collection('movies').get();
  const data=snap.docs.map(d=>{const x=d.data();return{id:d.id,...x,createdAt:x.createdAt?new Date(millis(x.createdAt)).toISOString():null}});
  const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),download:`cinestream_backup_${new Date().toISOString().slice(0,10)}.json`});
  a.click();
};
$('btnImport').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!Array.isArray(data))throw new Error('El archivo no es una lista');
    if(!confirm(`Se importarán ${data.length} títulos. Los que tengan el mismo ID se sobrescriben. ¿Continuar?`))return;
    for(let i=0;i<data.length;i+=400){
      const batch=db.batch();
      data.slice(i,i+400).forEach(({id,...item})=>{
        if(item.createdAt)item.createdAt=firebase.firestore.Timestamp.fromDate(new Date(item.createdAt));
        else item.createdAt=firebase.firestore.FieldValue.serverTimestamp();
        batch.set(id?db.collection('movies').doc(id):db.collection('movies').doc(),item);
      });
      await batch.commit();
    }
    $('maintMsg').textContent='✅ Importación completada.';loadTable();
  }catch(err){$('maintMsg').textContent='Error al importar: '+err.message}
  e.target.value='';
};
</script>
</body>
</html>
