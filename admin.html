<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineStream - Gestor de Biblioteca</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body { font-family: system-ui, sans-serif; background: #121318; color: #fff; margin: 0; padding: 30px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: #e50914; }
    .panel { background: #1c1e26; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #2e323e; }
    .form-group { display: flex; gap: 10px; margin-bottom: 10px; }
    input, select, button, textarea { padding: 10px; border-radius: 6px; border: 1px solid #333; background: #0f1015; color: #fff; }
    input[type="text"], textarea { flex: 1; }
    button { background: #e50914; color: #fff; font-weight: bold; border: none; cursor: pointer; }
    button.btn-sec { background: #2563eb; }
    button.btn-warn { background: #d97706; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #2e323e; }
    .status-badge { padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    .visible { background: #1b5e20; }
    .hidden { background: #b71c1c; }

    .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; }
    .modal-box { background:#1c1e26; padding:20px; border-radius:8px; width:400px; display:flex; flex-direction:column; gap:10px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Panel de Control de Biblioteca</h1>

    <!-- CARGA INDIVIDUAL -->
    <div class="panel">
      <h3>Añadir Título Individual</h3>
      <div class="form-group">
        <input type="text" id="addTitle" placeholder="Título exacto">
        <select id="addCategory">
          <option value="Película">Película</option>
          <option value="Serie">Serie</option>
          <option value="Documental">Documental</option>
        </select>
      </div>
      <div class="form-group">
        <input type="text" id="addUrl" placeholder="URL del vídeo (OK.RU o YouTube)">
        <button onclick="addAndEnrichMovie()">Guardar e Inyectar TMDB</button>
      </div>
    </div>

    <!-- CARGA MASIVA -->
    <div class="panel">
      <h3>Carga Masiva por Lotes</h3>
      <p style="font-size: 0.85rem; color:#aaa;">Pega varias líneas con el formato: <code>Título | URL | Categoría</code></p>
      <textarea id="batchInput" rows="4" placeholder="Matrix | https://ok.ru/video/123456 | Película&#10;Avatar | https://youtube.com/watch?v=xyz | Película"></textarea>
      <button class="btn-sec" onclick="processBatch()" style="margin-top:10px;">Procesar Lote Masivo</button>
    </div>
	
	<div style="background: #181920; padding: 20px; border-radius: 8px; margin-top: 20px; color: #fff;">
  <h3>📥 Importación Rápida desde Rumble</h3>
  <button onclick="fetchRumbleMovies()" style="background: #e50914; color: white; border: none; padding: 10px 18px; font-weight: bold; border-radius: 5px; cursor: pointer;">
    Obtener Películas del Canal
  </button>
  <div id="importStatus" style="margin-top: 10px; color: #aaa;"></div>
  
  <div id="importPreview" style="margin-top: 15px; max-height: 400px; overflow-y: auto;"></div>
</div>

    <!-- HERRAMIENTAS Y BACKUP -->
    <div class="panel">
      <h3>Mantenimiento y Copias de Seguridad</h3>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn-warn" onclick="checkBrokenLinks()">🔍 Verificar Enlaces Caídos</button>
        <button class="btn-sec" onclick="exportBackup()">📥 Exportar BBDD (JSON)</button>
        <button class="btn-sec" onclick="document.getElementById('importFile').click()">📤 Importar BBDD (JSON)</button>
        <input type="file" id="importFile" style="display:none" onchange="importBackup(event)">
      </div>
      <div id="maintStatus" style="margin-top:10px; font-size:0.9rem; color:#e50914;"></div>
    </div>

    <!-- TABLA DE GESTIÓN -->
    <div class="panel">
      <h3>Catálogo Guardado</h3>
      <table>
        <thead>
          <tr>
            <th>Portada</th>
            <th>Título</th>
            <th>Director</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="movieTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- MODAL EDICIÓN MANUAL -->
  <div id="editModal" class="modal">
    <div class="modal-box">
      <h3>Editar Metadatos</h3>
      <input type="hidden" id="editId">
      <input type="text" id="editTitle" placeholder="Título">
      <input type="text" id="editDirector" placeholder="Director">
      <input type="text" id="editPoster" placeholder="URL Portada">
      <textarea id="editOverview" placeholder="Sinopsis"></textarea>
      <button onclick="saveManualEdit()">Guardar Cambios</button>
      <button style="background:#333;" onclick="document.getElementById('editModal').style.display='none'">Cancelar</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyBG9gTNx3DlYLWizwud5iS3grjCY_VJ4kY",
  authDomain: "mi-reproductor-privado.firebaseapp.com",
  projectId: "mi-reproductor-privado",
  storageBucket: "mi-reproductor-privado.firebasestorage.app",
  messagingSenderId: "221209265432",
  appId: "1:221209265432:web:bf751603f347acdbc70a6d"
};

  // Claves de Google Custom Search (Opcionales para activar búsqueda nativa de Google)
  const TMDB_API_KEY = "3a05c1588b2c57b0cfe5fe1e57444271"; // Tu clave de TMDB
  const GOOGLE_SEARCH_API_KEY = "AIzaSyDg99lV_foIoOX3dl2w3qpf0D0VqgOv7jo"; 
  const GOOGLE_SEARCH_CX = "86acf450b6ef74927";
  const YOUTUBE_API_KEY = "AIzaSyC9e6uezABTG5JcJY9eBTEkFLdHXOKZ8Bo"; // Necesario para extraer metadata avanzada (duración, autor, etc.)
  
  // URL del canal objetivo
const RUMBLE_CHANNEL_URL = "https://rumble.com/c/c-7926356/videos";

async function fetchRumbleMovies() {
  const statusDiv = document.getElementById("importStatus");
  statusDiv.innerText = "Cargando películas desde Rumble...";

  try {
    // Usamos allorigins para evitar el bloqueo CORS del navegador
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(RUMBLE_CHANNEL_URL)}`;
    const response = await fetch(proxyUrl);
    const data = await response.json();
    
    // Convertimos la respuesta HTML en un Document navegable
    const parser = new DOMParser();
    const doc = parser.parseFromString(data.contents, 'text/html');
    
    // Obtenemos los elementos de los vídeos del canal
    const videoElements = doc.querySelectorAll('.video-item'); 
    const moviesFound = [];

    videoElements.forEach(item => {
      const titleEl = item.querySelector('.video-item--title');
      const linkEl = item.querySelector('a.video-item--a');
      const imgEl = item.querySelector('.video-item--img');

      if (titleEl && linkEl) {
        const title = titleEl.innerText.trim();
        const videoPageUrl = 'https://rumble.com' + linkEl.getAttribute('href');
        const poster = imgEl ? imgEl.getAttribute('src') : '';

        // Formateamos la URL para incrustarla directamente en tu reproductor (iframe embed)
        // Ejemplo Rumble embed: https://rumble.com/embed/v...
        const embedUrl = videoPageUrl.replace('rumble.com/', 'rumble.com/embed/');

        moviesFound.push({
          title: title,
          url: videoPageUrl, // o embedUrl según cómo reproduzcas
          poster: poster,
          category: 'Película',
          year: new Date().getFullYear().toString(),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    });

    statusDiv.innerText = `Se encontraron ${moviesFound.length} películas.`;
    renderImportPreview(moviesFound);

  } catch (error) {
    console.error("Error al obtener películas de Rumble:", error);
    statusDiv.innerText = "Error al conectar con la web de Rumble.";
  }
}

// Muestra la vista previa con botones para importar a Firebase
function renderImportPreview(movies) {
  const container = document.getElementById("importPreview");
  container.innerHTML = "";

  movies.forEach(movie => {
    const card = document.createElement("div");
    card.style = "display:flex; align-items:center; gap:10px; margin-bottom:10px; background:#222; padding:10px; border-radius:6px;";
    card.innerHTML = `
      <img src="${movie.poster}" style="width:50px; height:70px; object-fit:cover;">
      <div style="flex:1;">
        <strong>${movie.title}</strong><br>
        <small style="color:#aaa;">${movie.url}</small>
      </div>
      <button onclick='importSingleMovie(${JSON.stringify(movie)})' style="background:#2e7d32; color:#fff; border:none; padding:8px 12px; border-radius:4px; cursor:pointer;">
        ➕ Añadir a Firebase
      </button>
    `;
    container.appendChild(card);
  });
}

// Guarda la película seleccionada directamente en Firestore
function importSingleMovie(movieData) {
  db.collection("movies").add(movieData).then(() => {
    alert(`"${movieData.title}" añadida correctamente.`);
  }).catch(err => {
    alert("Error al guardar en la base de datos: " + err.message);
  });
}

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function loadAdminTable() {
      db.collection("movies").get().then(snapshot => {
        const tbody = document.getElementById('movieTableBody');
        tbody.innerHTML = '';
        snapshot.forEach(doc => {
          const m = doc.data();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><img src="${m.poster}" style="width:40px; height:60px; object-fit:cover;"></td>
            <td><strong>${m.title}</strong><br><small style="color:#888">${m.category}</small></td>
            <td>${m.director || '<i>Sin datos</i>'}</td>
            <td><span class="status-badge ${m.visible !== false ? 'visible' : 'hidden'}">${m.visible !== false ? 'Visible' : 'Oculta'}</span></td>
            <td>
              <button style="padding:4px;" onclick="openEditModal('${doc.id}', ${JSON.stringify(m).replace(/"/g, '&quot;')})">✏️</button>
              <button style="padding:4px;" onclick="toggleVisibility('${doc.id}', ${m.visible !== false})">${m.visible !== false ? 'Ocultar' : 'Mostrar'}</button>
              <button style="padding:4px; background:#dc2626;" onclick="deleteMovie('${doc.id}')">Borrar</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    async function processBatch() {
      const text = document.getElementById('batchInput').value.trim();
      if (!text) return;
      const lines = text.split('\n');
      for (const line of lines) {
        const [title, url, category] = line.split('|').map(s => s.trim());
        if (title && url) {
          const meta = await fetchTMDBData(title, category || 'Película');
          await db.collection("movies").add({
            title, url, category: category || 'Película',
            poster: meta.poster || 'https://via.placeholder.com/170x240?text=Sin+Imagen',
            overview: meta.overview || '', year: meta.year || '', director: meta.director || 'Desconocido',
            cast: meta.cast || [], genres: meta.genres || [], visible: true, createdAt: new Date()
          });
        }
      }
      document.getElementById('batchInput').value = '';
      loadAdminTable();
    }

    async function checkBrokenLinks() {
      const status = document.getElementById('maintStatus');
      status.innerText = "Comprobando enlaces...";
      const snapshot = await db.collection("movies").get();
      let broken = 0;
      for (const doc of snapshot.docs) {
        try {
          const res = await fetch(doc.data().url, { method: 'HEAD', mode: 'no-cors' });
        } catch (e) { broken++; }
      }
      status.innerText = `Revisión finalizada. Enlaces potencialmente inactivos: ${broken}`;
    }

    function exportBackup() {
      db.collection("movies").get().then(snapshot => {
        const data = snapshot.docs.map(doc => doc.data());
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `cinestream_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      });
    }

    function importBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (event) => {
        const data = JSON.parse(event.target.result);
        for (const item of data) { await db.collection("movies").add(item); }
        loadAdminTable();
      };
      reader.readAsText(file);
    }

    function openEditModal(id, movie) {
      document.getElementById('editId').value = id;
      document.getElementById('editTitle').value = movie.title || '';
      document.getElementById('editDirector').value = movie.director || '';
      document.getElementById('editPoster').value = movie.poster || '';
      document.getElementById('editOverview').value = movie.overview || '';
      document.getElementById('editModal').style.display = 'flex';
    }

    function saveManualEdit() {
      const id = document.getElementById('editId').value;
      db.collection("movies").doc(id).update({
        title: document.getElementById('editTitle').value,
        director: document.getElementById('editDirector').value,
        poster: document.getElementById('editPoster').value,
        overview: document.getElementById('editOverview').value
      }).then(() => {
        document.getElementById('editModal').style.display = 'none';
        loadAdminTable();
      });
    }

    async function fetchTMDBData(title, category) {
      if (!TMDB_API_KEY || TMDB_API_KEY === "TU_API_KEY_DE_TMDB") return {};
      try {
        const isTv = category === 'Serie';
        const type = isTv ? 'tv' : 'movie';
        const searchRes = await fetch(`https://api.themoviedb.org/3/search/${type}?api_key=${TMDB_API_KEY}&language=es-ES&query=${encodeURIComponent(title)}`);
        const searchData = await searchRes.json();
        if (!searchData.results || searchData.results.length === 0) return {};
        const match = searchData.results[0];

        const [creditsRes, genreRes] = await Promise.all([
          fetch(`https://api.themoviedb.org/3/${type}/${match.id}/credits?api_key=${TMDB_API_KEY}&language=es-ES`),
          fetch(`https://api.themoviedb.org/3/genre/${type}/list?api_key=${TMDB_API_KEY}&language=es-ES`)
        ]);
        const credits = await creditsRes.json();
        const genreList = await genreRes.json();

        const genreMap = {};
        if (genreList.genres) genreList.genres.forEach(g => genreMap[g.id] = g.name);
        const genres = (match.genre_ids || []).map(id => genreMap[id]).filter(Boolean);

        let director = 'Desconocido';
        if (isTv && credits.crew) {
          const creator = credits.crew.find(c => c.job === 'Executive Producer' || c.job === 'Creator');
          if (creator) director = creator.name;
        } else if (credits.crew) {
          const dir = credits.crew.find(c => c.job === 'Director');
          if (dir) director = dir.name;
        }

        return {
          poster: match.poster_path ? `https://image.tmdb.org/t/p/w500${match.poster_path}` : null,
          overview: match.overview || '',
          year: (match.release_date || match.first_air_date || '').split('-')[0],
          genres: genres.slice(0, 2), // Guardamos solo los 2 géneros más representativos
          director: director,
          cast: (credits.cast || []).slice(0, 5).map(c => c.name)
        };
      } catch (e) { return {}; }
    }

    async function addAndEnrichMovie() {
      const title = document.getElementById('addTitle').value.trim();
      let url = document.getElementById('addUrl').value.trim();
      const category = document.getElementById('addCategory').value;
      if (!title || !url) return;

      if (url.includes('ok.ru/video/')) {
        const match = url.match(/\/video\/(\d+)/);
        if (match && match[1]) url = `https://ok.ru/videoembed/${match[1]}`;
      }

      const meta = await fetchTMDBData(title, category);
      await db.collection("movies").add({
        title, url, category,
        poster: meta.poster || 'https://via.placeholder.com/170x240?text=Sin+Imagen',
        overview: meta.overview || '', year: meta.year || '', director: meta.director || 'Desconocido',
        cast: meta.cast || [], genres: meta.genres || [], visible: true, createdAt: new Date()
      });

      document.getElementById('addTitle').value = '';
      document.getElementById('addUrl').value = '';
      loadAdminTable();
    }

    function toggleVisibility(id, currentVisible) { db.collection("movies").doc(id).update({ visible: !currentVisible }).then(loadAdminTable); }
    function deleteMovie(id) { if (confirm('¿Eliminar?')) db.collection("movies").doc(id).delete().then(loadAdminTable); }

    loadAdminTable();
  </script>
</body>
</html>
