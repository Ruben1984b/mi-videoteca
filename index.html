
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineStream - Smart TV Player</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1a1c23;
      --accent: #e50914;
      --text: #f5f5f7;
      --text-muted: #9e9ea7;
    }

    body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg-color); color: var(--text); overflow-x: hidden; }
    header { padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%); position: sticky; top:0; z-index: 80; }
    .brand { font-size: 1.5rem; font-weight: 800; color: var(--accent); }

    .nav-filters { display: flex; gap: 10px; }
    .btn-filter { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; }
    .btn-filter:focus, .btn-filter.active { background: var(--accent); border-color: var(--accent); outline: none; }

    .search-input { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 8px 16px; color: #fff; width: 220px; }
    .search-input:focus { outline: none; border-color: var(--accent); background: rgba(0,0,0,0.7); }

    .container { padding: 20px 50px 50px 50px; }
    .player-wrapper { position: relative; padding-bottom: 56.25%; height: 0; display: none; margin-bottom: 30px; border-radius: 12px; overflow: hidden; border: 1px solid #2e323e; }
    .player-wrapper iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; }

    /* CONTROLES OSD EN PANTALLA SOBRE EL REPRODUCTOR */
    .osd-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%); display: none; flex-direction: column; gap: 8px; z-index: 60; box-sizing: border-box; transition: opacity 0.3s; }
    .osd-title { font-size: 1.2rem; font-weight: bold; color: #fff; }
    .osd-status { font-size: 0.9rem; color: var(--accent); font-weight: bold; text-transform: uppercase; }
    .osd-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.3); border-radius: 3px; overflow: hidden; }
    .osd-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }

    .next-ep-btn { position: absolute; bottom: 80px; right: 20px; z-index: 70; background: var(--accent); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; display: none; box-shadow: 0 0 15px rgba(229,9,20,0.6); }
    .next-ep-btn:focus { outline: 2px solid #fff; transform: scale(1.05); }

    .section { margin-bottom: 35px; }
    .section-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; color: #fff; }
    
    .carousel { display: flex; gap: 18px; overflow-x: auto; scroll-behavior: smooth; padding: 10px 5px; }
    .carousel::-webkit-scrollbar { display: none; }

    .card { min-width: 170px; max-width: 170px; background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: transform 0.2s, border-color 0.2s; position: relative; }
    .card:focus { outline: none; border-color: var(--accent); transform: scale(1.08); box-shadow: 0 10px 25px rgba(229, 9, 20, 0.5); z-index: 10; }
    .card-poster { width: 100%; height: 240px; object-fit: cover; background: #252833; }
    .card-title { padding: 8px; font-size: 0.85rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .progress-bar { position: absolute; bottom: 32px; left: 0; height: 4px; background: var(--accent); }
    .badge-watched { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #4caf50; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
    .badge-cat { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; }

    .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal-box { background: #161820; border-radius: 12px; max-width: 700px; width: 90%; padding: 25px; display: grid; grid-template-columns: 200px 1fr; gap: 20px; }
    .btn-action { border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn-play { background: #2e7d32; color: #fff; }
    .btn-sec { background: #333; color: #fff; }
    .btn-action:focus { outline: 2px solid #fff; transform: scale(1.03); }

    #screensaver { position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 1000; display: none; justify-content: center; align-items: center; }
    #screensaverImg { max-height: 80vh; border-radius: 12px; box-shadow: 0 0 50px rgba(229,9,20,0.3); transition: opacity 1s ease-in-out; }
  </style>
</head>
<body>

  <header>
    <div class="brand">🎬 CineStream TV</div>
    <div class="nav-filters">
      <button class="btn-filter active" tabindex="0" onclick="filterCategory('All')">Todos</button>
      <button class="btn-filter" tabindex="0" onclick="filterCategory('Película')">Películas</button>
      <button class="btn-filter" tabindex="0" onclick="filterCategory('Serie')">Series</button>
      <button class="btn-filter" tabindex="0" onclick="filterCategory('Vistos')">Vistos</button>
    </div>
    <input type="text" id="searchInput" class="search-input" tabindex="0" placeholder="Buscar..." oninput="handleSearch()">
  </header>

  <div class="container">
    <div id="playerWrapper" class="player-wrapper">
      <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="no-referrer-when-downgrade"></iframe>
      
      <!-- OSD SOBRE EL REPRODUCTOR -->
      <div id="osdOverlay" class="osd-overlay">
        <div id="osdTitle" class="osd-title">Cargando...</div>
        <div id="osdStatus" class="osd-status">▶ Reproduciendo</div>
        <div class="osd-bar-bg"><div id="osdBarFill" class="osd-bar-fill"></div></div>
      </div>

      <button id="btnNextEp" class="next-ep-btn" tabindex="0">▶ Siguiente Episodio</button>
    </div>

    <div id="searchResults" class="carousel" style="display:none; flex-wrap: wrap; gap:20px; margin-bottom: 40px;"></div>
    <div id="mainCatalog"></div>
  </div>

  <div id="detailModal" class="modal">
    <div class="modal-box">
      <img id="mPoster" src="" style="width:100%; border-radius:8px; aspect-ratio:2/3; object-fit:cover;">
      <div>
        <h2 id="mTitle" style="margin:0;"></h2>
        <div style="color:var(--text-muted); font-size:0.85rem; margin:8px 0;">
          <span id="mYear"></span> • <span id="mAge"></span> • <span id="mGenres"></span>
        </div>
        <p id="mOverview" style="font-size:0.88rem; line-height:1.4; color:#ccc; max-height:100px; overflow-y:auto;"></p>
        <div style="font-size:0.8rem; color:var(--text-muted);">
          <div><strong>Director:</strong> <span id="mDirector"></span></div>
          <div><strong>Reparto:</strong> <span id="mCast"></span></div>
        </div>
        
        <button id="btnPlay" class="btn-action btn-play" tabindex="0">▶ Reproducir ahora</button>
        <button id="btnToggleWatched" class="btn-action btn-sec" tabindex="0">✓ Marcar como visto</button>
        <button id="btnCloseModal" class="btn-action btn-sec" tabindex="0" onclick="closeModal()" style="background:#555;">✕ Cerrar información</button>
      </div>
    </div>
  </div>

  <div id="screensaver"><img id="screensaverImg" src=""></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBG9gTNx3DlYLWizwud5iS3grjCY_VJ4kY",
      authDomain: "mi-reproductor-privado.firebaseapp.com",
      projectId: "mi-reproductor-privado",
      storageBucket: "mi-reproductor-privado.firebasestorage.app",
      messagingSenderId: "221209265432",
      appId: "1:221209265432:web:bf751603f347acdbc70a6d"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allMovies = [];
    let currentCategoryFilter = 'All';
    let userProgress = JSON.parse(localStorage.getItem('cs_progress_sec') || '{}'); // Guarda segundos exactos
    let watchedList = JSON.parse(localStorage.getItem('cs_watched') || '[]');
    let idleTimer, screensaverInterval, osdTimer;
    let isPlayingVideo = false;
    let activeMovie = null;
    let currentPlaybackTime = 0;

    function resetIdleTimer() {
      clearTimeout(idleTimer);
      document.getElementById('screensaver').style.display = 'none';
      clearInterval(screensaverInterval);
      if (!isPlayingVideo) {
        idleTimer = setTimeout(startScreensaver, 300000);
      }
    }
    window.onload = resetIdleTimer;
    window.onmousemove = resetIdleTimer;
    window.onkeydown = resetIdleTimer;

    function startScreensaver() {
      if (allMovies.length === 0 || isPlayingVideo) return;
      const ss = document.getElementById('screensaver');
      const img = document.getElementById('screensaverImg');
      ss.style.display = 'flex';
      
      const changeImg = () => {
        const randomMovie = allMovies[Math.floor(Math.random() * allMovies.length)];
        img.style.opacity = 0;
        setTimeout(() => { img.src = randomMovie.poster; img.style.opacity = 1; }, 500);
      };
      changeImg();
      screensaverInterval = setInterval(changeImg, 6000);
    }

    db.collection("movies").get().then(snapshot => {
      allMovies = [];
      snapshot.forEach(doc => {
        if (doc.data().visible !== false) allMovies.push({ id: doc.id, ...doc.data() });
      });
      renderCatalog();
    });

    function filterCategory(cat) {
      currentCategoryFilter = cat;
      document.querySelectorAll('.btn-filter').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(cat) || (cat === 'All' && btn.innerText === 'Todos'));
      });
      renderCatalog();
    }

    function renderCatalog() {
      const container = document.getElementById('mainCatalog');
      container.innerHTML = '';

      let listToRender = allMovies;
      if (currentCategoryFilter === 'Vistos') {
        listToRender = allMovies.filter(m => watchedList.includes(m.id));
      } else if (currentCategoryFilter !== 'All') {
        listToRender = allMovies.filter(m => m.category === currentCategoryFilter);
      }

      const inProgress = listToRender.filter(m => userProgress[m.id] && userProgress[m.id] > 10);
      if (inProgress.length > 0) createSection("Continuar Viendo", inProgress);

      const recent = [...listToRender].sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)).slice(0, 10);
      createSection("Añadidos Recientemente", recent);

      ['Película', 'Serie', 'Documental'].forEach(cat => {
        if (currentCategoryFilter === 'All' || currentCategoryFilter === cat) {
          const filtered = listToRender.filter(m => m.category === cat);
          if (filtered.length > 0) createSection(cat === 'Película' ? 'Películas' : cat + 's', filtered);
        }
      });
    }

    function createSection(title, movies) {
      const catalog = document.getElementById('mainCatalog');
      const sec = document.createElement('div');
      sec.className = 'section';
      sec.innerHTML = `<div class="section-title">${title}</div><div class="carousel"></div>`;
      const row = sec.querySelector('.carousel');
      movies.forEach(m => row.appendChild(createCard(m)));
      catalog.appendChild(sec);
    }

    function createCard(movie) {
      const card = document.createElement('div');
      card.className = 'card';
      card.tabIndex = 0;
      
      const isWatched = watchedList.includes(movie.id);
      const progSec = userProgress[movie.id] || 0;

      card.innerHTML = `
        <span class="badge-cat">${movie.category || 'Peli'}</span>
        <img src="${movie.poster}" class="card-poster" onerror="this.src='https://via.placeholder.com/170x240?text=Sin+Imagen'">
        ${isWatched ? '<div class="badge-watched">✓</div>' : ''}
        ${progSec > 10 ? `<div class="progress-bar" style="width:40%"></div>` : ''}
        <div class="card-title">${movie.title}</div>
      `;
      card.onclick = () => openModal(movie);
      card.onfocus = () => card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      card.onkeydown = (e) => { if (e.key === 'Enter') openModal(movie); };
      return card;
    }

    function closeModal() {
      const modal = document.getElementById('detailModal');
      modal.style.display = 'none';
      if (window.lastFocusedCard) {
        window.lastFocusedCard.focus();
      }
    }

    function openModal(movie) {
      window.lastFocusedCard = document.activeElement;
      activeMovie = movie;

      document.getElementById('mTitle').innerText = movie.title || '';
      document.getElementById('mPoster').src = movie.poster || '';
      document.getElementById('mYear').innerText = movie.year || '----';
      document.getElementById('mAge').innerText = movie.ageRating || 'TP';
      document.getElementById('mGenres').innerText = (movie.genres || []).slice(0, 2).join(', ');
      document.getElementById('mOverview').innerText = movie.overview || 'Sin descripción.';
      document.getElementById('mDirector').innerText = movie.director || 'Desconocido';
      document.getElementById('mCast').innerText = Array.isArray(movie.cast) ? movie.cast.join(', ') : (movie.cast || '');

      const modal = document.getElementById('detailModal');
      modal.style.display = 'flex';

      const btnWatched = document.getElementById('btnToggleWatched');
      btnWatched.innerText = watchedList.includes(movie.id) ? '✕ Marcar como no visto' : '✓ Marcar como visto';
      btnWatched.onclick = () => {
        if (watchedList.includes(movie.id)) watchedList = watchedList.filter(id => id !== movie.id);
        else watchedList.push(movie.id);
        localStorage.setItem('cs_watched', JSON.stringify(watchedList));
        openModal(movie);
        renderCatalog();
      };
      
      const playBtn = document.getElementById('btnPlay');
      const savedTime = userProgress[movie.id] || 0;
      playBtn.innerText = savedTime > 30 ? `▶ Reanudar desde ${Math.floor(savedTime/60)}m` : '▶ Reproducir ahora';
      playBtn.focus();
      playBtn.onclick = () => {
        closeModal();
        playVideo(movie, savedTime);
      };
    }

    function showOSD(statusText) {
      const osd = document.getElementById('osdOverlay');
      document.getElementById('osdTitle').innerText = activeMovie ? activeMovie.title : '';
      document.getElementById('osdStatus').innerText = statusText;
      osd.style.display = 'flex';
      
      clearTimeout(osdTimer);
      osdTimer = setTimeout(() => {
        osd.style.display = 'none';
      }, 3000);
    }

    function stopVideo() {
      const wrapper = document.getElementById('playerWrapper');
      const player = document.getElementById('videoPlayer');
      
      // Guardar punto exacto al salir
      if (activeMovie && currentPlaybackTime > 10) {
        userProgress[activeMovie.id] = currentPlaybackTime;
        localStorage.setItem('cs_progress_sec', JSON.stringify(userProgress));
      }

      player.src = '';
      wrapper.style.display = 'none';
      document.getElementById('osdOverlay').style.display = 'none';
      document.getElementById('btnNextEp').style.display = 'none';
      isPlayingVideo = false;
      resetIdleTimer();
      renderCatalog();
      if (window.lastFocusedCard) window.lastFocusedCard.focus();
    }

    function playVideo(movie, startTime = 0) {
      activeMovie = movie;
      currentPlaybackTime = startTime;
      const wrapper = document.getElementById('playerWrapper');
      const player = document.getElementById('videoPlayer');
      const btnNext = document.getElementById('btnNextEp');
      
      if (!movie.url) {
        alert("El enlace del vídeo no está disponible.");
        return;
      }

      let formattedUrl = movie.url.trim();

      // 1. FORMATO DAILYMOTION (Soporta dailymotion.com/video/ID y dai.ly/ID)
      if (formattedUrl.includes('dailymotion.com') || formattedUrl.includes('dai.ly')) {
        let videoId = '';
        if (formattedUrl.includes('/video/')) {
          videoId = formattedUrl.split('/video/')[1].split('?')[0];
        } else if (formattedUrl.includes('dai.ly/')) {
          videoId = formattedUrl.split('dai.ly/')[1].split('?')[0];
        } else if (formattedUrl.includes('/embed/video/')) {
          videoId = formattedUrl.split('/embed/video/')[1].split('?')[0];
        }
        
        if (videoId) {
          formattedUrl = `https://www.dailymotion.com/embed/video/${videoId}?autoplay=1`;
        }
      }

      // 2. FORMATO RUMBLE (Garantiza el formato embed /embed/ID/)
      if (formattedUrl.includes('rumble.com')) {
        if (!formattedUrl.includes('/embed/')) {
          // Si es un enlace de reproducción estándar, intentamos usar su ruta embed directa
          const match = formattedUrl.match(/rumble\.com\/v([a-zA-Z0-9]+)-/);
          if (match && match[1]) {
            formattedUrl = `https://rumble.com/embed/v${match[1]}/?pub=4`;
          }
        }
      }

      // 3. FORMATO OK.RU
      if (formattedUrl.includes('ok.ru/video/')) {
        const match = formattedUrl.match(/\/video\/(\d+)/);
        if (match && match[1]) {
          formattedUrl = `https://ok.ru/videoembed/${match[1]}?autoplay=1`;
        }
      }

      // 4. FORMATO YOUTUBE
      if (formattedUrl.includes('youtube.com/watch') || formattedUrl.includes('youtu.be/')) {
        let videoId = '';
        if (formattedUrl.includes('v=')) {
          videoId = formattedUrl.split('v=')[1].split('&')[0];
        } else if (formattedUrl.includes('youtu.be/')) {
          videoId = formattedUrl.split('youtu.be/')[1].split('?')[0];
        }
        if (videoId) {
          formattedUrl = `https://www.youtube.com/embed/\({videoId}?autoplay=1&enablejsapi=1&start=\){Math.floor(startTime)}`;
        }
      }

      player.src = formattedUrl;
      wrapper.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      isPlayingVideo = true;
      resetIdleTimer();
      showOSD("▶ Reproduciendo");

      if (movie.category === 'Serie') {
        const seriesList = allMovies.filter(m => m.category === 'Serie');
        const currentIndex = seriesList.findIndex(m => m.id === movie.id);
        if (currentIndex !== -1 && currentIndex + 1 < seriesList.length) {
          btnNext.style.display = 'block';
          btnNext.onclick = () => playVideo(seriesList[currentIndex + 1], 0);
        } else {
          btnNext.style.display = 'none';
        }
      } else {
        btnNext.style.display = 'none';
      }
    }

    // CONTROL CON MANDO A DISTANCIA Y TECLAS MULTIMEDIA
    window.addEventListener('keydown', function(e) {
      const modal = document.getElementById('detailModal');
      const player = document.getElementById('videoPlayer');
      
      // BOTÓN ATRÁS
      if (e.key === 'Escape' || e.key === 'Backspace' || e.keyCode === 27 || e.keyCode === 8 || e.keyCode === 4 || e.keyCode === 10009) {
        if (isPlayingVideo) {
          e.preventDefault();
          stopVideo();
        } else if (modal && modal.style.display === 'flex') {
          e.preventDefault();
          closeModal();
        }
      }

      if (isPlayingVideo) {
        // RETROCEDER -10 SEG
        if (e.key === 'ArrowLeft' || e.keyCode === 37) {
          e.preventDefault();
          currentPlaybackTime = Math.max(0, currentPlaybackTime - 10);
          showOSD("⏪ -10 Segundos");
          if (player.contentWindow) {
            player.contentWindow.postMessage('{"event":"command","func":"seekTo","args":[-10, true]}', '*');
          }
        }

        // AVANZAR +10 SEG
        if (e.key === 'ArrowRight' || e.keyCode === 39) {
          e.preventDefault();
          currentPlaybackTime += 10;
          showOSD("⏩ +10 Segundos");
          if (player.contentWindow) {
            player.contentWindow.postMessage('{"event":"command","func":"seekTo","args":[10, true]}', '*');
          }
        }

        // PAUSA / OK
        if (e.key === ' ' || e.key === 'MediaPlayPause' || e.keyCode === 179) {
          e.preventDefault();
          showOSD("⏸ Pausa / Reproducir");
          if (player.contentWindow) {
            player.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
          }
        }
      }
    });

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const resultsDiv = document.getElementById('searchResults');
      const catalogDiv = document.getElementById('mainCatalog');

      if (!q) { resultsDiv.style.display = 'none'; catalogDiv.style.display = 'block'; return; }

      const matches = allMovies.filter(m => 
        (m.title && m.title.toLowerCase().includes(q)) ||
        (m.director && m.director.toLowerCase().includes(q)) ||
        (m.cast && Array.isArray(m.cast) && m.cast.some(a => a.toLowerCase().includes(q))) ||
        (m.genres && Array.isArray(m.genres) && m.genres.some(g => g.toLowerCase().includes(q)))
      );

      resultsDiv.innerHTML = '';
      if (matches.length > 0) matches.forEach(m => resultsDiv.appendChild(createCard(m)));
      else resultsDiv.innerHTML = '<div style="padding:20px;">Sin resultados.</div>';

      catalogDiv.style.display = 'none';
      resultsDiv.style.display = 'flex';
    }
  </script>
</body>
</html>
