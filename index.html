<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineStream - Mi Videoteca Personal</title>
  
  <!-- Firebase SDK App y Firestore -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    :root {
      --bg-color: #0f1015;
      --card-bg: #1a1c23;
      --card-hover: #242834;
      --accent-primary: #e50914;
      --accent-ok: #ff7a00;
      --accent-yt: #ff0000;
      --text-main: #f5f5f7;
      --text-muted: #9e9ea7;
      --border-color: #2e323e;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    header {
      background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(15,16,21,1) 100%);
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(45deg, #e50914, #ff5252);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      color: #fff;
      background: var(--accent-primary);
    }

    .container {
      padding: 30px 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .search-bar, .manual-form {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      max-width: 650px;
    }

    input, select, button {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #14161d;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent-primary);
    }

    input[type="text"], input[type="url"] {
      flex: 1;
    }

    button.btn-main {
      background: var(--accent-primary);
      border: none;
      cursor: pointer;
      font-weight: 700;
      transition: opacity 0.2s;
    }

    button.btn-main:hover {
      opacity: 0.9;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      background: var(--card-hover);
    }

    .card-poster {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #252833;
    }

    .card-content {
      padding: 14px;
      flex: 1;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255,255,255,0.08);
      color: var(--text-muted);
      font-weight: 600;
    }

    .item-actions {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-row {
      display: flex;
      gap: 8px;
    }

    .play-btn {
      border: none;
      color: white;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      width: 100%;
      background: #2e7d32;
    }

    .btn-edit {
      background: #2563eb;
      border: none;
      color: white;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .btn-delete {
      background: #dc2626;
      border: none;
      color: white;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .player-container {
      margin-bottom: 30px;
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      background: #000;
      border-radius: 12px;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid var(--border-color);
    }

    .player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* MODAL GENERAL Y DE EDICIÓN */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #161820;
      border-radius: 14px;
      width: 90%;
      max-width: 750px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-controls {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 24px;
      background: #111217;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #20232e;
      padding: 14px;
      border-radius: 8px;
      gap: 15px;
    }

    .result-info {
      flex: 1;
    }

    .result-title {
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .result-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .source-tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
    }
    .source-youtube { background: var(--accent-yt); color: #fff; }
    .source-okru { background: var(--accent-ok); color: #fff; }

    .btn-add-item {
      background: #2e7d32;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .form-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo">
      <span>🎬</span> CineStream
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('tab-library', event)">Colección</button>
      <button class="tab-btn" onclick="switchTab('tab-search', event)">Buscar Vídeos</button>
      <button class="tab-btn" onclick="switchTab('tab-manual', event)">Añadir Enlace</button>
    </div>
  </header>

  <div class="container">
    
    <!-- REPRODUCTOR DE VÍDEO -->
    <div id="playerWrapper" class="player-container">
      <iframe id="videoPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <!-- PESTAÑA 1: BIBLIOTECA -->
    <div id="tab-library" class="tab-content active">
      <h2 style="margin-top:0;">Mi Biblioteca</h2>
      <div id="libraryGrid" class="grid"></div>
    </div>

    <!-- PESTAÑA 2: BUSCADOR -->
    <div id="tab-search" class="tab-content">
      <h2 style="margin-top:0;">Catálogo General</h2>
      <div class="search-bar">
        <input type="text" id="searchQuery" placeholder="Buscar película o serie...">
        <button class="btn-main" onclick="searchMovieAndOkRu()">Buscar</button>
      </div>
      <div id="searchResults" class="grid"></div>
    </div>

    <!-- PESTAÑA 3: AÑADIDO MANUAL -->
    <div id="tab-manual" class="tab-content">
      <h2 style="margin-top:0;">Añadir Vídeo Manualmente</h2>
      <div class="manual-form" style="flex-direction: column;">
        <input type="text" id="manualTitle" placeholder="Título de la película">
        <input type="url" id="manualUrl" placeholder="Enlace directo de YouTube u OK.RU">
        <input type="url" id="manualPoster" placeholder="URL de la portada / carátula (Opcional)">
        <select id="manualCategory">
          <option value="Película">Película</option>
          <option value="Serie">Serie</option>
          <option value="Documental">Documental</option>
        </select>
        <button class="btn-main" onclick="addManualVideo()">Guardar en biblioteca</button>
      </div>
    </div>

  </div>

  <!-- MODAL BÚSQUEDA Y FILTRADO -->
  <div id="videoSelectModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalMediaTitle" style="margin:0;">Opciones de vídeo encontradas</h3>
        <button class="modal-close" onclick="closeModal('videoSelectModal')">&times;</button>
      </div>
      <div class="modal-controls">
        <label style="font-size: 0.9rem; color: var(--text-muted);">Origen del resultado:</label>
        <select id="sourceFilter" onchange="filterModalResults()">
          <option value="all">Todas las fuentes</option>
          <option value="youtube">Solo YouTube</option>
          <option value="okru">Solo OK.RU</option>
        </select>
      </div>
      <div id="modalVideoList" class="modal-body"></div>
    </div>
  </div>

  <!-- MODAL DE EDICIÓN -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <h3 style="margin:0;">Editar Tarjeta</h3>
        <button class="modal-close" onclick="closeModal('editModal')">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editDocId">
        <div class="form-group">
          <label>Título:</label>
          <input type="text" id="editTitle">
        </div>
        <div class="form-group">
          <label>URL de la Carátula / Portada:</label>
          <input type="url" id="editPoster">
        </div>
        <div class="form-group">
          <label>Etiqueta / Categoría:</label>
          <select id="editCategory">
            <option value="Película">Película</option>
            <option value="Serie">Serie</option>
            <option value="Documental">Documental</option>
          </select>
        </div>
        <div class="form-group">
          <label>Enlace del vídeo (Embed URL):</label>
          <input type="url" id="editUrl">
        </div>
        <button class="btn-main" onclick="saveEditedVideo()" style="margin-top: 10px;">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <script>
      // CONFIGURACIÓN FIREBASE Y GOOGLE
  const firebaseConfig = {
  apiKey: "AIzaSyBG9gTNx3DlYLWizwud5iS3grjCY_VJ4kY",
  authDomain: "mi-reproductor-privado.firebaseapp.com",
  projectId: "mi-reproductor-privado",
  storageBucket: "mi-reproductor-privado.firebasestorage.app",
  messagingSenderId: "221209265432",
  appId: "1:221209265432:web:bf751603f347acdbc70a6d"
};

  // Claves de Google Custom Search (Opcionales para activar búsqueda nativa de Google)
  const TMDB_API_KEY = "3a05c1588b2c57b0cfe5fe1e57444271"; // Tu clave de TMDB
  const GOOGLE_SEARCH_API_KEY = "AIzaSyDg99lV_foIoOX3dl2w3qpf0D0VqgOv7jo"; 
  const GOOGLE_SEARCH_CX = "86acf450b6ef74927";
  const YOUTUBE_API_KEY = "AIzaSyC9e6uezABTG5JcJY9eBTEkFLdHXOKZ8Bo"; // Necesario para extraer metadata avanzada (duración, autor, etc.)

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let currentSelectedItem = null;
    let rawFetchedResults = [];

    function switchTab(tabId, event) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      if (event && event.target) {
        event.target.classList.add('active');
      }

      if (tabId === 'tab-library') {
        loadLibrary();
      }
    }

    async function searchMovieAndOkRu() {
      const query = document.getElementById('searchQuery').value.trim();
      if (!query) return;

      const container = document.getElementById('searchResults');
      container.innerHTML = '<div style="grid-column: 1/-1; text-align: center;">🔍 Buscando en TMDB...</div>';

      const tmdbUrl = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=es-ES&query=${encodeURIComponent(query)}`;

      try {
        const res = await fetch(tmdbUrl);
        const data = await res.json();
        container.innerHTML = '';

        if (!data.results || data.results.length === 0) {
          container.innerHTML = '<div style="grid-column: 1/-1; text-align: center;">No se encontraron títulos</div>';
          return;
        }

        data.results.slice(0, 8).forEach(item => {
          const title = item.title || item.name;
          if (!title) return;

          const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/300x420/1a1c23/ffffff?text=Sin+Imagen';
          const category = item.media_type === 'tv' ? 'Serie' : 'Película';
          const cleanTitle = title.replace(/'/g, "\\'");

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${poster}" class="card-poster">
            <div class="card-content">
              <div class="card-title">${title}</div>
              <span class="badge">${category}</span>
            </div>
            <div class="item-actions">
              <button class="play-btn btn-main" onclick="initMultiSourceSearch('${cleanTitle}', '${poster}', '${category}')">
                + Seleccionar Vídeo
              </button>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        console.error(e);
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color:#ff5252;">Error de conexión</div>';
      }
    }

    async function initMultiSourceSearch(title, poster, category) {
      currentSelectedItem = { title, poster, category };
      
      const modalList = document.getElementById('modalVideoList');
      document.getElementById('modalMediaTitle').innerText = `Vídeos para: "${title}"`;
      modalList.innerHTML = '<div style="text-align:center; padding: 20px;">🔍 Obteniendo fuentes disponible...</div>';
      
      document.getElementById('videoSelectModal').style.display = 'flex';

      try {
        const [ytResults, okResults] = await Promise.all([
          fetchYouTubeVideos(title + " pelicula completa"),
          fetchOkRuVideosWithTimeout(title, 3500) // Timeout de 3.5 segundos para no bloquear la app
        ]);

        rawFetchedResults = [...ytResults, ...okResults];

        if (rawFetchedResults.length === 0) {
          modalList.innerHTML = '<div style="text-align:center; padding: 20px;">No se encontraron vídeos automáticos de larga duración.<br><br><small>Puedes añadir el enlace de OK.RU manualmente en la pestaña "Añadir Enlace".</small></div>';
          return;
        }

        filterModalResults();

      } catch (error) {
        console.error(error);
        modalList.innerHTML = '<div style="text-align:center; color: #ff5252; padding: 20px;">Error obteniendo vídeos.</div>';
      }
    }


    // Función para consultar tu API interna en Vercel
async function fetchOkRuVideos(query) {
  try {
    const res = await fetch(`/api/okru?q=${encodeURIComponent(query)}`);
    if (!res.ok) return [];
    return await res.json();
  } catch (e) {
    console.error("Error consultando el endpoint interno de OK.RU:", e);
    return [];
  }
}

	async function fetchYouTubeVideos(query) {
      if (!YOUTUBE_API_KEY || YOUTUBE_API_KEY === "TU_YOUTUBE_API_KEY") return [];
      
      try {
        const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(query)}&type=video&videoEmbeddable=true&key=${YOUTUBE_API_KEY}`;
        const res = await fetch(searchUrl);
        const data = await res.json();

        if (!data.items || data.items.length === 0) return [];

        const videoIds = data.items.map(item => item.id.videoId).join(',');
        const detailsUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails&id=${videoIds}&key=${YOUTUBE_API_KEY}`;
        const detailsRes = await fetch(detailsUrl);
        const detailsData = await detailsRes.json();

        const currentOrigin = window.location.origin !== "null" ? window.location.origin : "*";

        return detailsData.items
          .filter(item => parseISOToSeconds(item.contentDetails.duration) >= 1200)
          .map(item => ({
            source: 'youtube',
            sourceName: 'YouTube',
            title: item.snippet.title,
            uploader: item.snippet.channelTitle,
            duration: parseISO8601Duration(item.contentDetails.duration),
            quality: 'HD',
            embedUrl: `https://www.youtube.com/embed/${item.id}?enablejsapi=1&origin=${encodeURIComponent(currentOrigin)}`
          }));
      } catch (e) {
        console.error("Error en YouTube API:", e);
        return [];
      }
    }

    // OK.RU BÚSQUEDA CON TIEMPO LÍMITE (Evita cuelgues por CORS/Proxy)
    async function fetchOkRuVideosWithTimeout(query, timeoutMs = 5000) {
  const controller = new AbortController();
  const idTimeout = setTimeout(() => controller.abort(), timeoutMs);

  try {
    // Consulta a la búsqueda pública de vídeos de OK.RU mediante proxy CORS
    const searchTarget = `https://ok.ru/search?st.mode=video&st.gsearch=${encodeURIComponent(query)}`;
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(searchTarget)}`;

    const response = await fetch(proxyUrl, { signal: controller.signal });
    clearTimeout(idTimeout);
    
    const data = await response.json();
    if (!data || !data.contents) return [];

    // Parseo de la estructura HTML recibida
    const parser = new DOMParser();
    const htmlDoc = parser.parseFromString(data.contents, 'text/html');
    
    // Contenedores típicos de los resultados de vídeo en OK.RU
    const videoNodes = htmlDoc.querySelectorAll('.video-card, .v-card, .portlet_b');
    const parsedResults = [];

    videoNodes.forEach(node => {
      const linkAnchor = node.querySelector('a[href*="/video/"]');
      const titleNode = node.querySelector('.video-card_n, .video-card_name, .ellip');
      const durationNode = node.querySelector('.video-card_duration, .video-card_time, .vd-card_duration');

      if (linkAnchor) {
        const href = linkAnchor.getAttribute('href');
        const videoIdMatch = href.match(/\/video\/(\d+)/);

        if (videoIdMatch && videoIdMatch[1]) {
          const videoId = videoIdMatch[1];
          const title = titleNode ? titleNode.innerText.trim() : query;
          const duration = durationNode ? durationNode.innerText.trim() : 'N/A';

          parsedResults.push({
            source: 'okru',
            sourceName: 'OK.RU',
            title: title,
            uploader: 'OK.RU',
            duration: duration,
            quality: 'HD',
            embedUrl: `https://ok.ru/videoembed/${videoId}`
          });
        }
      }
    });

    // Eliminación de duplicados según la URL de embed
    const uniqueMap = new Map();
    parsedResults.forEach(item => uniqueMap.set(item.embedUrl, item));
    
    return Array.from(uniqueMap.values()).slice(0, 10);

  } catch (error) {
    console.warn("No se pudieron obtener resultados de OK.RU dentro del tiempo límite:", error);
    return [];
  }
}

    function filterModalResults() {
      const selectedSource = document.getElementById('sourceFilter').value;
      let filtered = rawFetchedResults;

      if (selectedSource !== 'all') {
        filtered = rawFetchedResults.filter(r => r.source === selectedSource);
      }

      renderModalResults(filtered);
    }

    function renderModalResults(results) {
      const modalList = document.getElementById('modalVideoList');
      modalList.innerHTML = '';

      if (results.length === 0) {
        modalList.innerHTML = '<div style="text-align:center; padding: 15px;">No hay resultados disponibles para este filtro.</div>';
        return;
      }

      results.forEach(res => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'result-item';
        
        const badgeClass = res.source === 'youtube' ? 'source-youtube' : 'source-okru';

        itemDiv.innerHTML = `
          <div class="result-info">
            <div class="result-title">${res.title}</div>
            <div class="result-meta">
              <span class="source-tag ${badgeClass}">${res.sourceName}</span>
              <span>Canal: <strong>${res.uploader}</strong></span>
              <span>⏱ ${res.duration}</span>
            </div>
          </div>
          <button class="btn-add-item" onclick='confirmAndSave(${JSON.stringify(res)})'>
            + Agregar
          </button>
        `;
        modalList.appendChild(itemDiv);
      });
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    function confirmAndSave(videoData) {
      if (!currentSelectedItem) return;

      db.collection("movies").add({
        title: currentSelectedItem.title,
        url: videoData.embedUrl,
        poster: currentSelectedItem.poster,
        category: currentSelectedItem.category,
        source: videoData.source,
        videoTitle: videoData.title,
        uploader: videoData.uploader,
        duration: videoData.duration,
        watched: false,
        createdAt: new Date()
      }).then(() => {
        alert("✅ Título añadido a tu colección");
        closeModal('videoSelectModal');
        switchTab('tab-library', { target: document.querySelectorAll('.tab-btn')[0] });
      }).catch(err => {
        console.error(err);
      });
    }

    function addManualVideo() {
      const title = document.getElementById('manualTitle').value.trim();
      let url = document.getElementById('manualUrl').value.trim();
      const poster = document.getElementById('manualPoster').value.trim() || 'https://via.placeholder.com/300x420/1a1c23/ffffff?text=Sin+Imagen';
      const category = document.getElementById('manualCategory').value;

      if (!title || !url) {
        alert("Por favor completa el título y el enlace.");
        return;
      }

      // Ajustar enlace de OK.RU si viene en formato estándar
      if (url.includes('ok.ru/video/')) {
        const match = url.match(/\/video\/(\d+)/);
        if (match && match[1]) {
          url = `https://ok.ru/videoembed/${match[1]}`;
        }
      }

      db.collection("movies").add({
        title: title,
        url: url,
        poster: poster,
        category: category,
        createdAt: new Date()
      }).then(() => {
        alert("✅ Vídeo añadido a la colección");
        document.getElementById('manualTitle').value = '';
        document.getElementById('manualUrl').value = '';
        document.getElementById('manualPoster').value = '';
        switchTab('tab-library', { target: document.querySelectorAll('.tab-btn')[0] });
      });
    }

    // -----------------------------------------------------------------
    // CARGA DE BIBLIOTECA, EDICIÓN Y ELIMINACIÓN
    // -----------------------------------------------------------------
    function loadLibrary() {
      const container = document.getElementById('libraryGrid');
      container.innerHTML = '<div style="grid-column: 1/-1; text-align: center;">Cargando colección...</div>';

      db.collection("movies").orderBy("createdAt", "desc").get().then(snapshot => {
        container.innerHTML = '';
        if (snapshot.empty) {
          container.innerHTML = '<div style="grid-column: 1/-1; text-align: center;">No hay películas en tu biblioteca.</div>';
          return;
        }

        snapshot.forEach(doc => {
          const data = doc.data();
          const id = doc.id;
          const cleanTitle = (data.title || '').replace(/'/g, "\\'");
          const cleanPoster = (data.poster || '').replace(/'/g, "\\'");
          const cleanUrl = (data.url || '').replace(/'/g, "\\'");

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${data.poster}" class="card-poster" onerror="this.src='https://via.placeholder.com/300x420/1a1c23/ffffff?text=Sin+Imagen'">
            <div class="card-content">
              <div class="card-title">${data.title}</div>
              <span class="badge">${data.category || 'Película'}</span>
            </div>
            <div class="item-actions">
              <button class="play-btn" onclick="playVideo('${cleanUrl}')">
                ▶ Ver Ahora
              </button>
              <div class="action-row">
                <button class="btn-edit" onclick="openEditModal('${id}', '${cleanTitle}', '${cleanPoster}', '${data.category || 'Película'}', '${cleanUrl}')">✏️ Editar</button>
                <button class="btn-delete" onclick="deleteVideo('${id}')">🗑️ Eliminar</button>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      });
    }

    function openEditModal(id, title, poster, category, url) {
      document.getElementById('editDocId').value = id;
      document.getElementById('editTitle').value = title;
      document.getElementById('editPoster').value = poster;
      document.getElementById('editCategory').value = category;
      document.getElementById('editUrl').value = url;
      document.getElementById('editModal').style.display = 'flex';
    }

    function saveEditedVideo() {
      const id = document.getElementById('editDocId').value;
      const title = document.getElementById('editTitle').value.trim();
      const poster = document.getElementById('editPoster').value.trim();
      const category = document.getElementById('editCategory').value;
      const url = document.getElementById('editUrl').value.trim();

      if (!id || !title) return;

      db.collection("movies").doc(id).update({
        title: title,
        poster: poster,
        category: category,
        url: url
      }).then(() => {
        closeModal('editModal');
        loadLibrary();
      }).catch(err => {
        console.error("Error al actualizar:", err);
      });
    }

    function deleteVideo(id) {
      if (confirm("¿Seguro que deseas eliminar este vídeo de tu colección?")) {
        db.collection("movies").doc(id).delete().then(() => {
          loadLibrary();
        }).catch(err => {
          console.error("Error al eliminar:", err);
        });
      }
    }

    function parseISOToSeconds(isoDuration) {
      const regex = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/;
      const matches = isoDuration.match(regex);
      if (!matches) return 0;
      const hours = parseInt(matches[1] || 0) * 3600;
      const minutes = parseInt(matches[2] || 0) * 60;
      const seconds = parseInt(matches[3] || 0);
      return hours + minutes + seconds;
    }

    function parseISO8601Duration(isoDuration) {
      const regex = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/;
      const matches = isoDuration.match(regex);
      if (!matches) return 'N/A';
      const hours = matches[1] ? `${matches[1]}h ` : '';
      const minutes = matches[2] ? `${matches[2]}m ` : '';
      return `${hours}${minutes}`.trim() || 'N/A';
    }

    function playVideo(url) {
  const wrapper = document.getElementById('playerWrapper');
  const player = document.getElementById('videoPlayer');
  
  let formattedUrl = url;

  // Si es un enlace embebido de YouTube, forzamos los parámetros de origen y seguridad
  if (formattedUrl.includes('youtube.com/embed/')) {
    const origin = window.location.origin !== "null" && window.location.origin !== "file://" 
      ? window.location.origin 
      : "https://www.youtube.com";

    // Limpiamos parámetros previos si existían
    const cleanBase = formattedUrl.split('?')[0];
    formattedUrl = `${cleanBase}?enablejsapi=1&autoplay=1&origin=${encodeURIComponent(origin)}`;
  }

  player.src = formattedUrl;
  wrapper.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

    loadLibrary();
  </script>
