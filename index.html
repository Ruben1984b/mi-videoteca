<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineStream - TV Interface</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    :root {
      --bg-color: #0f1015;
      --card-bg: #1a1c23;
      --accent-primary: #e50914;
      --accent-ok: #ff7a00;
      --accent-yt: #ff0000;
      --text-main: #f5f5f7;
      --text-muted: #9e9ea7;
      --border-color: #2e323e;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    header {
      background: #0a0b0e;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent-primary);
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 10px 20px;
      cursor: pointer;
      font-weight: 600;
      border-radius: 20px;
      transition: all 0.2s;
    }

    /* ESTILOS DE FOCO PARA EL MANDO D-PAD */
    .tab-btn:focus, .tab-btn.active {
      color: #fff;
      background: var(--accent-primary);
      outline: 2px solid #fff;
    }

    .container {
      padding: 20px 40px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* REPRODUCTOR */
    .player-container {
      margin-bottom: 30px;
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      background: #000;
      border-radius: 12px;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid var(--border-color);
    }

    .player-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }

    /* CARRUSELES DE LA BIBLIOTECA */
    .category-section { margin-bottom: 30px; }
    .category-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 12px; color: #fff; }

    .carousel-container {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 10px 5px;
    }

    .carousel-container::-webkit-scrollbar { display: none; }

    .tv-card {
      min-width: 180px;
      max-width: 180px;
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }

    .tv-card:focus {
      outline: none;
      border-color: var(--accent-primary);
      transform: scale(1.08);
      box-shadow: 0 10px 25px rgba(229, 9, 20, 0.5);
      z-index: 10;
    }

    .tv-card-poster {
      width: 100%;
      height: 250px;
      object-fit: cover;
      background: #252833;
    }

    .tv-card-title {
      padding: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    /* BÚSQUEDA Y REJILLA */
    .search-bar, .manual-form {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      max-width: 650px;
    }

    input, select, button {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #14161d;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    input:focus, select:focus, button:focus {
      outline: 2px solid var(--accent-primary);
    }

    input[type="text"], input[type="url"] { flex: 1; }

    button.btn-main {
      background: var(--accent-primary);
      border: none;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    /* MODALES */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #161820;
      border-radius: 14px;
      width: 90%;
      max-width: 650px;
      max-height: 85vh;
      padding: 24px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-body {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #20232e;
      padding: 12px;
      border-radius: 8px;
    }

    .source-tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
    }
    .source-youtube { background: var(--accent-yt); color: #fff; }
    .source-okru { background: var(--accent-ok); color: #fff; }

    .btn-action {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn-play { background: #2e7d32; color: #fff; }
    .btn-delete { background: #dc2626; color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo">🎬 CineStream TV</div>
    <div class="nav-tabs">
      <button class="tab-btn active" tabindex="0" onclick="switchTab('tab-library', event)">Colección</button>
      <button class="tab-btn" tabindex="0" onclick="switchTab('tab-search', event)">Buscar</button>
      <button class="tab-btn" tabindex="0" onclick="switchTab('tab-manual', event)">Añadir Enlace</button>
    </div>
  </header>

  <div class="container">
    <!-- REPRODUCTOR -->
    <div id="playerWrapper" class="player-container">
      <iframe id="videoPlayer" src="" allowfullscreen></iframe>
    </div>

    <!-- PESTAÑA 1: BIBLIOTECA CARRUSELES TV -->
    <div id="tab-library" class="tab-content active">
      <div id="tvLibraryRows"></div>
    </div>

    <!-- PESTAÑA 2: BUSCADOR TMDB -->
    <div id="tab-search" class="tab-content">
      <h2>Catálogo General (TMDB)</h2>
      <div class="search-bar">
        <input type="text" id="searchQuery" tabindex="0" placeholder="Buscar película o serie..." onkeypress="if(event.key==='Enter') searchTMDB()">
        <button class="btn-main" tabindex="0" onclick="searchTMDB()">Buscar</button>
      </div>
      <div id="searchResults" class="grid"></div>
    </div>

    <!-- PESTAÑA 3: AÑADIDO MANUAL -->
    <div id="tab-manual" class="tab-content">
      <h2>Añadir Enlace Directo</h2>
      <div class="manual-form" style="flex-direction: column;">
        <input type="text" id="manualTitle" tabindex="0" placeholder="Título de la película">
        <input type="url" id="manualUrl" tabindex="0" placeholder="Enlace directo de YouTube u OK.RU">
        <input type="url" id="manualPoster" tabindex="0" placeholder="URL de la portada (Opcional)">
        <select id="manualCategory" tabindex="0">
          <option value="Película">Película</option>
          <option value="Serie">Serie</option>
          <option value="Documental">Documental</option>
        </select>
        <button class="btn-main" tabindex="0" onclick="addManualVideo()">Guardar en biblioteca</button>
      </div>
    </div>
  </div>

  <!-- MODAL OPCIONES DE VÍDEO BÚSQUEDA -->
  <div id="videoSelectModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalMediaTitle" style="margin:0;">Fuentes encontradas</h3>
        <button class="modal-close" onclick="closeModal('videoSelectModal')">&times;</button>
      </div>
      <div style="margin-bottom: 12px;">
        <select id="sourceFilter" tabindex="0" onchange="filterModalResults()">
          <option value="all">Todas las fuentes</option>
          <option value="youtube">Solo YouTube</option>
          <option value="okru">Solo OK.RU</option>
        </select>
      </div>
      <div id="modalVideoList" class="modal-body"></div>
    </div>
  </div>

  <!-- MODAL DE ACCIONES DE PELÍCULA BIBLIOTECA -->
  <div id="actionModal" class="modal-overlay">
    <div class="modal-content" style="max-width: 400px;">
      <h3 id="modalMovieTitle" style="margin-top:0;"></h3>
      <button class="btn-action btn-play" id="btnPlayModal" tabindex="0">▶ Reproducir</button>
      <button class="btn-action btn-delete" id="btnDeleteModal" tabindex="0">🗑️ Eliminar de la colección</button>
      <button class="btn-action" onclick="closeModal('actionModal')" style="background:#333; color:#fff;" tabindex="0">Cancelar</button>
    </div>
  </div>

  <script>
    // CONFIGURACIÓN FIREBASE Y GOOGLE
  const firebaseConfig = {
  apiKey: "AIzaSyBG9gTNx3DlYLWizwud5iS3grjCY_VJ4kY",
  authDomain: "mi-reproductor-privado.firebaseapp.com",
  projectId: "mi-reproductor-privado",
  storageBucket: "mi-reproductor-privado.firebasestorage.app",
  messagingSenderId: "221209265432",
  appId: "1:221209265432:web:bf751603f347acdbc70a6d"
};

  // Claves de Google Custom Search (Opcionales para activar búsqueda nativa de Google)
  const TMDB_API_KEY = "3a05c1588b2c57b0cfe5fe1e57444271"; // Tu clave de TMDB
  const GOOGLE_SEARCH_API_KEY = "AIzaSyDg99lV_foIoOX3dl2w3qpf0D0VqgOv7jo"; 
  const GOOGLE_SEARCH_CX = "86acf450b6ef74927";
  const YOUTUBE_API_KEY = "AIzaSyC9e6uezABTG5JcJY9eBTEkFLdHXOKZ8Bo"; // Necesario para extraer metadata avanzada (duración, autor, etc.)

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let selectedMovie = null;
    let currentSelectedItem = null;
    let rawFetchedResults = [];

    function switchTab(tabId, event) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (event) event.target.classList.add('active');

      if (tabId === 'tab-library') loadTVLibrary();
    }

    /* 1. BÚSQUEDA TMDB */
    async function searchTMDB() {
      const query = document.getElementById('searchQuery').value.trim();
      if (!query) return;

      const container = document.getElementById('searchResults');
      container.innerHTML = '<div style="grid-column: 1/-1; text-align: center;">🔍 Buscando en TMDB...</div>';

      const tmdbUrl = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=es-ES&query=${encodeURIComponent(query)}`;

      try {
        const res = await fetch(tmdbUrl);
        const data = await res.json();
        container.innerHTML = '';

        if (!data.results || data.results.length === 0) {
          container.innerHTML = '<div style="grid-column: 1/-1; text-align: center;">No se encontraron títulos</div>';
          return;
        }

        data.results.slice(0, 10).forEach(item => {
          const title = item.title || item.name;
          if (!title) return;

          const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/180x250/1a1c23/ffffff?text=Sin+Imagen';
          const category = item.media_type === 'tv' ? 'Serie' : 'Película';
          const cleanTitle = title.replace(/'/g, "\\'");

          const card = document.createElement('div');
          card.className = 'tv-card';
          card.tabIndex = 0;
          card.innerHTML = `
            <img src="${poster}" class="tv-card-poster">
            <div class="tv-card-title">${title}</div>
          `;
          
          card.onclick = () => initMultiSourceSearch(cleanTitle, poster, category);
          card.onkeydown = (e) => { if (e.key === 'Enter') initMultiSourceSearch(cleanTitle, poster, category); };

          container.appendChild(card);
        });
      } catch (e) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color:#ff5252;">Error de conexión con TMDB</div>';
      }
    }

    /* 2. OBTENER VÍDEOS DE YOUTUBE Y OK.RU */
    async function initMultiSourceSearch(title, poster, category) {
      currentSelectedItem = { title, poster, category };
      
      const modalList = document.getElementById('modalVideoList');
      document.getElementById('modalMediaTitle').innerText = `Vídeos para: "${title}"`;
      modalList.innerHTML = '<div style="text-align:center; padding: 20px;">🔍 Obteniendo fuentes disponibles...</div>';
      
      document.getElementById('videoSelectModal').style.display = 'flex';

      try {
        const [ytResults, okResults] = await Promise.all([
          fetchYouTubeVideos(title + " pelicula completa"),
          fetchOkRuVideos(title)
        ]);

        rawFetchedResults = [...ytResults, ...okResults];

        if (rawFetchedResults.length === 0) {
          modalList.innerHTML = '<div style="text-align:center; padding: 20px;">No se encontraron vídeos automáticos.<br><br><small>Prueba añadiendo el enlace de OK.RU manualmente.</small></div>';
          return;
        }

        filterModalResults();
      } catch (error) {
        modalList.innerHTML = '<div style="text-align:center; color: #ff5252; padding: 20px;">Error obteniendo vídeos.</div>';
      }
    }

    async function fetchYouTubeVideos(query) {
      if (!YOUTUBE_API_KEY || YOUTUBE_API_KEY === "TU_YOUTUBE_API_KEY") return [];
      try {
        const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${encodeURIComponent(query)}&type=video&videoEmbeddable=true&key=${YOUTUBE_API_KEY}`;
        const res = await fetch(searchUrl);
        const data = await res.json();
        if (!data.items) return [];

        const currentOrigin = window.location.origin !== "null" && window.location.origin !== "file://" 
          ? window.location.origin : "https://www.youtube.com";

        return data.items.map(item => ({
          source: 'youtube',
          sourceName: 'YouTube',
          title: item.snippet.title,
          embedUrl: `https://www.youtube.com/embed/${item.id.videoId}?enablejsapi=1&autoplay=1&origin=${encodeURIComponent(currentOrigin)}`
        }));
      } catch (e) {
        return [];
      }
    }

    async function fetchOkRuVideos(query) {
      try {
        const res = await fetch(`/api/okru?q=${encodeURIComponent(query)}`);
        if (!res.ok) return [];
        return await res.json();
      } catch (e) {
        return [];
      }
    }

    function filterModalResults() {
      const selectedSource = document.getElementById('sourceFilter').value;
      let filtered = rawFetchedResults;
      if (selectedSource !== 'all') {
        filtered = rawFetchedResults.filter(r => r.source === selectedSource);
      }
      renderModalResults(filtered);
    }

    function renderModalResults(results) {
      const modalList = document.getElementById('modalVideoList');
      modalList.innerHTML = '';

      if (results.length === 0) {
        modalList.innerHTML = '<div style="text-align:center; padding: 15px;">Sin resultados para este filtro.</div>';
        return;
      }

      results.forEach(res => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'result-item';
        const badgeClass = res.source === 'youtube' ? 'source-youtube' : 'source-okru';

        itemDiv.innerHTML = `
          <div style="flex:1;">
            <div style="font-weight:700; font-size:0.9rem;">${res.title}</div>
            <span class="source-tag ${badgeClass}">${res.sourceName}</span>
          </div>
          <button class="btn-main" tabindex="0" style="padding: 6px 12px;" onclick='confirmAndSave(${JSON.stringify(res)})'>
            + Guardar
          </button>
        `;
        modalList.appendChild(itemDiv);
      });
    }

    function confirmAndSave(videoData) {
      if (!currentSelectedItem) return;

      db.collection("movies").add({
        title: currentSelectedItem.title,
        url: videoData.embedUrl,
        poster: currentSelectedItem.poster,
        category: currentSelectedItem.category,
        createdAt: new Date()
      }).then(() => {
        closeModal('videoSelectModal');
        switchTab('tab-library', { target: document.querySelectorAll('.tab-btn')[0] });
      });
    }

    /* 3. AÑADIR MANUALMENTE */
    function addManualVideo() {
      const title = document.getElementById('manualTitle').value.trim();
      let url = document.getElementById('manualUrl').value.trim();
      const poster = document.getElementById('manualPoster').value.trim() || 'https://via.placeholder.com/180x250/1a1c23/ffffff?text=Sin+Imagen';
      const category = document.getElementById('manualCategory').value;

      if (!title || !url) return;

      if (url.includes('ok.ru/video/')) {
        const match = url.match(/\/video\/(\d+)/);
        if (match && match[1]) url = `https://ok.ru/videoembed/${match[1]}`;
      }

      db.collection("movies").add({
        title: title,
        url: url,
        poster: poster,
        category: category,
        createdAt: new Date()
      }).then(() => {
        document.getElementById('manualTitle').value = '';
        document.getElementById('manualUrl').value = '';
        document.getElementById('manualPoster').value = '';
        switchTab('tab-library', { target: document.querySelectorAll('.tab-btn')[0] });
      });
    }

    /* 4. CARGAR CARRUSELES EN BIBLIOTECA */
    function loadTVLibrary() {
      const container = document.getElementById('tvLibraryRows');
      container.innerHTML = '<div style="text-align:center;">Cargando carruseles...</div>';

      db.collection("movies").orderBy("createdAt", "desc").get().then(snapshot => {
        container.innerHTML = '';
        if (snapshot.empty) {
          container.innerHTML = '<div style="text-align:center;">No hay títulos en la colección.</div>';
          return;
        }

        const movies = [];
        snapshot.forEach(doc => movies.push({ id: doc.id, ...doc.data() }));

        const categories = [
          { name: "Añadidas Recientemente", items: movies.slice(0, 10) },
          { name: "Películas", items: movies.filter(m => m.category === 'Película').slice(0, 10) },
          { name: "Series", items: movies.filter(m => m.category === 'Serie').slice(0, 10) },
          { name: "Documentales", items: movies.filter(m => m.category === 'Documental').slice(0, 10) }
        ];

        categories.forEach(cat => {
          if (cat.items.length === 0) return;

          const section = document.createElement('div');
          section.className = 'category-section';
          section.innerHTML = `
            <div class="category-title">${cat.name}</div>
            <div class="carousel-container"></div>
          `;
          container.appendChild(section);

          const row = section.querySelector('.carousel-container');
          cat.items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'tv-card';
            card.tabIndex = 0;
            card.innerHTML = `
              <img src="${item.poster}" class="tv-card-poster" onerror="this.src='https://via.placeholder.com/180x250/1a1c23/ffffff?text=Sin+Imagen'">
              <div class="tv-card-title">${item.title}</div>
            `;
            
            card.onclick = () => openActionModal(item);
            card.onkeydown = (e) => { if (e.key === 'Enter') openActionModal(item); };

            row.appendChild(card);
          });
        });
      });
    }

    function openActionModal(movie) {
      selectedMovie = movie;
      document.getElementById('modalMovieTitle').innerText = movie.title;
      document.getElementById('actionModal').style.display = 'flex';
      
      const playBtn = document.getElementById('btnPlayModal');
      playBtn.focus();
      
      playBtn.onclick = () => {
        closeModal('actionModal');
        playVideo(movie.url);
      };

      document.getElementById('btnDeleteModal').onclick = () => {
        if (confirm(`¿Eliminar ${movie.title}?`)) {
          db.collection("movies").doc(movie.id).delete().then(() => {
            closeModal('actionModal');
            loadTVLibrary();
          });
        }
      };
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function playVideo(url) {
      const wrapper = document.getElementById('playerWrapper');
      const player = document.getElementById('videoPlayer');
      let formattedUrl = url;

      if (formattedUrl.includes('youtube.com/embed/')) {
        const origin = window.location.origin !== "null" && window.location.origin !== "file://" 
          ? window.location.origin : "https://www.youtube.com";
        const cleanBase = formattedUrl.split('?')[0];
        formattedUrl = `${cleanBase}?enablejsapi=1&autoplay=1&origin=${encodeURIComponent(origin)}`;
      }

      player.src = formattedUrl;
      wrapper.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    loadTVLibrary();
  </script>
</body>
</html>
