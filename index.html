<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<meta name="mobile-web-app-capable" content="yes">

<title>CineStream - Smart TV Player</title>

<style>
:root{--bg:#0b0c10;--card:#1a1c23;--accent:#e50914;--muted:#9e9ea7;--surface:rgba(255,255,255,.06)}
body{margin:0;font-family:'Inter','Segoe UI',Roboto,sans-serif;background:var(--bg);color:#f5f5f7;overflow-x:hidden}
header{padding:15px 50px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);position:sticky;top:0;z-index:80;backdrop-filter:blur(8px)}
.brand{font-size:1.5rem;font-weight:800;color:var(--accent);margin:0}
.nav-filters{display:flex;gap:10px;flex-wrap:wrap}
.btn-filter{background:var(--surface);border:1px solid rgba(255,255,255,.1);color:#fff;padding:8px 16px;border-radius:20px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-filter:focus-visible,.btn-filter.active{background:var(--accent);border-color:var(--accent);outline:none;box-shadow:0 0 15px rgba(229,9,20,.4)}
.search-container{position:relative;display:flex;align-items:center}
.search-input{background:var(--surface);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:8px 16px;color:#fff;width:220px;padding-right:40px}
.search-input:focus{outline:none;border-color:var(--accent);background:rgba(0,0,0,.7)}
#btnVoice{position:absolute;right:8px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;display:none}
#btnVoice.listening{color:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
.container{padding:20px 50px 50px}
.player-wrapper{position:relative;padding-bottom:56.25%;height:0;display:none;margin-bottom:30px;border-radius:12px;overflow:hidden;border:1px solid #2e323e;background:#000;outline:none}
.player-wrapper iframe, .player-wrapper video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#hlsPlayer{display:none}
.enh1{filter:contrast(1.06) saturate(1.12) brightness(1.02)}
.enh2{filter:url(#sharpen) contrast(1.08) saturate(1.15) brightness(1.03)}
.osd{position:absolute;bottom:0;left:0;width:100%;padding:20px;background:linear-gradient(0deg,rgba(0,0,0,.95),transparent);display:none;flex-direction:column;gap:8px;z-index:60;box-sizing:border-box;pointer-events:none}
.osd-title{font-size:1.2rem;font-weight:bold}.osd-status{font-size:.9rem;color:var(--accent);font-weight:bold;text-transform:uppercase}
.osd-bar{height:6px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}.osd-fill{height:100%;background:var(--accent);width:0}
.pbtn{position:absolute;z-index:70;background:rgba(20,20,25,.65);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.15);padding:10px 18px;border-radius:30px;font-weight:600;cursor:pointer;display:none;transition:all .2s}
.pbtn:focus{outline:2px solid #fff;transform:scale(1.05);background:rgba(229,9,20,.8);border-color:transparent}
#btnNextEp{bottom:80px;right:20px;background:var(--accent)}#btnInfo{top:15px;right:20px}#btnReport{top:15px;left:20px}#btnEnh{top:15px;left:190px}
.section{margin-bottom:35px}.section-title{font-size:1.25rem;font-weight:700;margin-bottom:12px}
.carousel{display:flex;gap:18px;overflow-x:auto;padding:10px 5px}.carousel::-webkit-scrollbar{display:none}
.card{min-width:170px;max-width:170px;background:var(--card);border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer;flex-shrink:0;transition:transform .2s,border-color .2s;position:relative}
.card:focus-visible,.card:hover{outline:none;border-color:var(--accent);transform:scale(1.05);box-shadow:0 10px 25px rgba(229,9,20,.3);z-index:10}
.card-poster{width:100%;height:240px;object-fit:cover;background:#252833;display:block}
.card-title{padding:8px;font-size:.85rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{position:absolute;bottom:32px;left:0;height:4px;background:var(--accent)}
.badge-w{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.8);color:#4caf50;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold}
.badge-c{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;text-transform:uppercase}
.badge-f{position:absolute;top:34px;left:8px;font-size:14px}
.badge-n{position:absolute;left:6px;bottom:38px;background:rgba(0,0,0,.75);padding:1px 5px;border-radius:4px;font-size:10px;font-weight:600}
.badge-q{position:absolute;right:6px;bottom:38px;background:rgba(0,0,0,.75);padding:1px 5px;border-radius:4px;font-size:10px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:100;padding:20px;box-sizing:border-box}
.modal-box{background:#161820;border-radius:12px;max-width:780px;width:100%;max-height:92vh;overflow-y:auto;padding:25px;display:grid;grid-template-columns:220px 1fr;gap:25px;box-sizing:border-box}
.btn-action{border:none;padding:12px;border-radius:6px;font-weight:700;cursor:pointer;width:100%;margin-top:10px;background:#333;color:#fff;text-align:left}
.btn-play{background:#2e7d32}.btn-action:focus-visible{outline:2px solid #fff;transform:scale(1.03)}
.eps{max-height:260px;overflow-y:auto}.eps .btn-action{margin-top:4px;padding:8px;font-weight:600}
#screensaver{position:fixed;inset:0;background:#000;z-index:1000;display:none;justify-content:center;align-items:center}
#ssImg{max-height:80vh;border-radius:12px;transition:opacity 1s}
.hero{position:relative;border-radius:12px;overflow:hidden;margin-bottom:30px;display:none;background:#161820;min-height:250px}
.hero-bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(30px) brightness(.4)}
.hero-in{position:relative;display:flex;gap:25px;padding:25px;align-items:center}
.hero img{width:130px;border-radius:8px;aspect-ratio:2/3;object-fit:cover;flex-shrink:0}
.hero h2{margin:0 0 8px;font-size:1.8rem}.hero p{max-width:620px;color:#ddd;font-size:.95rem;line-height:1.4;max-height:4.3em;overflow:hidden;margin:0 0 14px}
.hero .btn-action{width:auto;display:inline-block;padding:12px 24px;margin:0 8px 0 0}
.sel{background:var(--surface);border:1px solid rgba(255,255,255,.1);color:#fff;padding:8px 12px;border-radius:20px;font:inherit;max-width:180px}
.sel option{color:#000}.sel:focus{outline:none;border-color:var(--accent)}
.chip{background:#2a2d38;color:#fff;border:1px solid #3a3e4d;border-radius:12px;padding:2px 10px;margin:2px 4px 2px 0;font-size:.78rem;cursor:pointer}.chip:focus-visible{outline:2px solid #fff}
.skeleton{background:#1a1c23;border-radius:8px;position:relative;overflow:hidden;min-width:170px;height:240px}
.skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@media(max-width:700px){.hero-in{flex-direction:column;text-align:center}.hero img{width:100px}}
@media(max-width:700px){header,.container{padding-left:15px;padding-right:15px}.modal-box{grid-template-columns:1fr;padding:16px}.modal-box img{max-width:140px;margin:0 auto}.search-input{width:100%}.modal{padding:0}}
body{-webkit-tap-highlight-color:transparent}
button,.card{touch-action:manipulation}
.mnav,.mbar{display:none}
body.mobile{padding-top:env(safe-area-inset-top);padding-bottom:calc(62px + env(safe-area-inset-bottom))}
body.mobile header{padding:10px 12px;gap:8px}
body.mobile .brand{font-size:1.15rem}
body.mobile .nav-filters,body.mobile #lenSel{display:none}
body.mobile .search-container{flex:1;width:auto;min-width:0}
body.mobile .search-input{width:100%;padding:10px 14px;font-size:16px}
body.mobile #genreSel{max-width:130px;padding:10px}
body.mobile .container{padding:8px 12px 20px}
body.mobile .section{margin-bottom:22px}body.mobile .section-title{font-size:1.05rem}
body.mobile .carousel{gap:10px;scroll-snap-type:x proximity}
body.mobile .card{min-width:112px;max-width:112px;scroll-snap-align:start}
body.mobile .card:focus{transform:none;box-shadow:none}
body.mobile .card-poster{height:168px}
body.mobile .card-title{font-size:.75rem;padding:6px}
body.mobile .hero-in{padding:14px;gap:12px;flex-direction:row;text-align:left}
body.mobile .hero img{width:84px}body.mobile .hero h2{font-size:1.15rem}body.mobile .hero p{display:none}
body.mobile .hero .btn-action{padding:12px 16px}
body.mobile.playing header{display:none}
body.mobile .player-wrapper{position:sticky;top:env(safe-area-inset-top,0px);z-index:70;margin:0 -12px 0;border-radius:0;border-left:0;border-right:0}
body.mobile.playing .mbar{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;margin:0 -12px 10px;position:sticky;top:calc(56.25vw + env(safe-area-inset-top,0px));z-index:70;background:var(--bg-color,#0b0c10)}
.mbar::-webkit-scrollbar{display:none}
.mbar button{flex:none;background:#2a2d38;color:#fff;border:0;border-radius:18px;padding:9px 14px;font:600 .8rem 'Segoe UI',Roboto,sans-serif;white-space:nowrap}
body.mobile .modal{align-items:flex-end;padding:0}
body.mobile .modal-box{width:100%;max-width:none;max-height:92vh;border-radius:16px 16px 0 0;grid-template-columns:96px 1fr;gap:12px;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
body.mobile .modal-box img{max-width:96px;margin:0}
body.mobile .btn-action{padding:14px}
body.mobile .eps{max-height:none}
body.mobile .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:90;background:rgba(11,12,16,.97);border-top:1px solid #2e323e;padding-bottom:env(safe-area-inset-bottom)}
.mnav button{flex:1;background:none;border:0;color:#9e9ea7;padding:9px 2px 7px;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.mnav button b{font-size:1.2rem;font-weight:400}.mnav button.on{color:#fff}
#loginScreen{position:fixed;inset:0;background:var(--bg);z-index:2000;display:none;flex-direction:column;justify-content:center;align-items:center;padding:20px}
#loadingScreen{position:fixed;inset:0;background:var(--bg);z-index:3000;display:flex;justify-content:center;align-items:center;flex-direction:column;color:var(--muted);gap:15px}
#loadingScreen .spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loginScreen .box{background:var(--card);padding:30px;border-radius:12px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:center}
#loginScreen h1{color:var(--accent);margin-top:0}
#loginScreen input{width:100%;box-sizing:border-box;padding:12px;margin-bottom:15px;background:#0f1015;border:1px solid #333;color:#fff;border-radius:6px;font-size:1rem}
#loginScreen button{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-weight:bold;font-size:1rem;cursor:pointer}
#loginScreen button:disabled{opacity:.6;cursor:wait}
#loginErr{color:#f87171;margin-top:15px;font-size:.9rem}
#appContent{display:none}
#btnLogout{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;margin-left:10px}
#btnLogout:hover{color:#fff}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: reduce) {*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
.detail-meta { font-size:.85rem; color:var(--muted); margin-bottom:15px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.detail-meta span { background:rgba(255,255,255,.08); padding:3px 8px; border-radius:6px; color:#ddd; }
.detail-overview { font-size:.95rem; line-height:1.55; color:#ddd; margin-bottom:20px; white-space:pre-wrap; max-height:none; overflow:visible; }
.detail-section { font-size:.75rem; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
.detail-chips { margin-bottom:15px; }
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <div>Cargando CineStream...</div>
</div>

<div id="loginScreen">
  <div class="box">
    <h1>🎬 CineStream</h1>
    <p style="color:var(--muted);margin-bottom:20px">Inicia sesión para acceder a tu videoteca</p>
    <label for="loginEmail" class="sr-only">Correo electrónico</label>
    <input type="email" id="loginEmail" placeholder="Correo electrónico" autocomplete="username">
    <label for="loginPass" class="sr-only">Contraseña</label>
    <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password">
    <button id="btnDoLogin">Entrar</button>
    <div id="loginErr"></div>
    <p style="font-size:.8rem;color:#555;margin-top:20px">Si no tienes cuenta, pídesela al administrador.</p>
  </div>
</div>

<div id="appContent">
  <header>
    <h1 class="brand">🎬 CineStream TV</h1>
    <div class="nav-filters">
      <button class="btn-filter active" data-cat="All">Todos</button>
      <button class="btn-filter" data-cat="Película">Películas</button>
      <button class="btn-filter" data-cat="Serie">Series</button>
      <button class="btn-filter" data-cat="Documental">Documentales</button>
      <button class="btn-filter" data-cat="Pendientes">Sin ver</button>
      <button class="btn-filter" data-cat="Vistos">Vistos</button>
      <button class="btn-filter" data-cat="Lista">⭐ Mi lista</button>
    </div>
    <label for="genreSel" class="sr-only">Género</label>
    <select id="genreSel" class="sel"><option value="">Todos los géneros</option></select>
    <label for="lenSel" class="sr-only">Duración</label>
    <select id="lenSel" class="sel"><option value="0">Cualquier duración</option><option value="100">Menos de 100 min</option><option value="130">Menos de 130 min</option></select>
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar..." aria-label="Buscar películas">
      <button id="btnVoice" title="Buscar por voz">🎤</button>
    </div>
    <div><span id="userEmail" style="font-size:.8rem;color:var(--muted)"></span><button id="btnLogout">Salir</button></div>
  </header>

  <div class="container">
    <div id="playerWrapper" class="player-wrapper" tabindex="-1">
      <iframe id="videoPlayer" src="" title="Reproductor de vídeo" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
      <video id="hlsPlayer" controls playsinline></video>
      <div id="osd" class="osd"><div id="osdTitle" class="osd-title"></div><div id="osdStatus" class="osd-status"></div><div class="osd-bar"><div id="osdFill" class="osd-fill"></div></div></div>
      <button id="btnInfo" class="pbtn" aria-label="Información y episodios">ℹ Info / Episodios</button>
      <button id="btnReport" class="pbtn" aria-label="Reportar enlace caído">🚩 Enlace caído</button>
      <button id="btnEnh" class="pbtn" aria-label="Ajuste de imagen">✨ Imagen</button>
      <button id="btnNextEp" class="pbtn" aria-label="Siguiente episodio">▶ Siguiente episodio</button>
    </div>
    <div id="hero" class="hero"></div>
    <div id="searchResults" class="carousel" style="display:none;flex-wrap:wrap;gap:20px;margin-bottom:40px"></div>
    <div id="mainCatalog">
      <div class="section"><h2 class="section-title">Cargando...</h2><div class="carousel">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div></div>
    </div>
  </div>

  <div id="detailModal" class="modal">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <img id="mPoster" alt="" style="width:100%;border-radius:8px;aspect-ratio:2/3;object-fit:cover">
      <div>
        <h2 id="mTitle" style="margin:0;font-size:1.7rem;line-height:1.2"></h2>
        <div id="mMeta" class="detail-meta"></div>
        <div id="mOverview" class="detail-overview"></div>

        <div class="detail-section">Director</div>
        <div id="mDirector" class="detail-chips"></div>

        <div class="detail-section">Reparto</div>
        <div id="mCast" class="detail-chips"></div>

        <button id="btnPlay" class="btn-action btn-play"></button>
        <div id="mEps" class="eps"></div>
        <div id="mRecs"></div>
        <button id="btnWatched" class="btn-action"></button>
        <button id="btnFav" class="btn-action"></button>
        <button id="btnClose" class="btn-action">✕ Cerrar</button>
      </div>
    </div>
  </div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="sharpen"><feConvolveMatrix order="3" kernelMatrix="0 -0.5 0 -0.5 3 -0.5 0 -0.5 0" divisor="1" preserveAlpha="true"/></filter></svg>
  <div id="screensaver"><img id="ssImg" alt=""></div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBG9gTNx3DlYLWizwud5iS3grjCY_VJ4kY",authDomain:"mi-reproductor-privado.firebaseapp.com",
  projectId:"mi-reproductor-privado",storageBucket:"mi-reproductor-privado.firebasestorage.app",
  messagingSenderId:"221209265432",appId:"1:221209265432:web:bf751603f347acdbc70a6d"
});
const db=firebase.firestore(), auth=firebase.auth(), $=id=>document.getElementById(id);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(e => console.warn('SW fallo:', e));
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e => console.error(e));

/* ---------- Login blindado ---------- */
let isLoggingIn = false;
let hasResolvedAuth = false;

auth.onAuthStateChanged(user => {
  hasResolvedAuth = true;
  $('loadingScreen').style.display = 'none';

  try {
    if (user) {
      $('loginScreen').style.display = 'none';
      $('appContent').style.display = 'block';
      $('userEmail').textContent = user.email;
      initApp();
    } else {
      if (!isLoggingIn) {
        $('loginScreen').style.display = 'flex';
        $('appContent').style.display = 'none';
      }
    }
  } catch (e) {
    console.error("Error al inicializar la app:", e);
    $('loadingScreen').innerHTML = '<div style="color:#f87171;text-align:center">Error al cargar.<br><br><button onclick="location.reload()" style="padding:10px 20px;background:#e50914;color:#fff;border:none;border-radius:6px;cursor:pointer">Recargar página</button></div>';
    $('loadingScreen').style.display = 'flex';
  }
});

// Fallback: si en 3s no se resolvió la sesión, mostrar login (por si falla la red)
setTimeout(() => {
  if (!hasResolvedAuth) {
    $('loadingScreen').style.display = 'none';
    $('loginScreen').style.display = 'flex';
  }
}, 3000);

$('btnDoLogin').onclick = () => {
  $('loginErr').textContent = '';
  const email = $('loginEmail').value.trim(), pass = $('loginPass').value;
  if (!email || !pass) return;

  const b = $('btnDoLogin');
  b.disabled = true; b.textContent = 'Entrando...';
  isLoggingIn = true;

  auth.signInWithEmailAndPassword(email, pass)
    .catch(e => {
      const msgs = {
        'auth/wrong-password': 'Contraseña incorrecta',
        'auth/user-not-found': 'No existe cuenta con ese correo',
        'auth/too-many-requests': 'Demasiados intentos. Espera un poco.'
      };
      $('loginErr').textContent = msgs[e.code] || 'Error al iniciar sesión.';
    })
    .finally(() => { b.disabled = false; b.textContent = 'Entrar'; isLoggingIn = false; });
};
$('loginPass').onkeydown = e => { if(e.key === 'Enter') $('btnDoLogin').click(); };
$('btnLogout').onclick = () => { if (confirm('¿Cerrar sesión?')) auth.signOut(); };

/* ---------- Globales ---------- */
const PH='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="170" height="240"><rect width="100%" height="100%" fill="#252833"/><text x="50%" y="50%" fill="#777" font-size="14" text-anchor="middle">Sin imagen</text></svg>');
const CATS=[['Película','Películas'],['Serie','Series'],['Documental','Documentales']];
const h=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);e.append(...k);return e};
const millis=c=>c&&c.toMillis?c.toMillis():c&&c.seconds?c.seconds*1000:c?(new Date(c).getTime()||0):0;
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

let all=[], filter='All', genre='', maxLen=0;
let progress={}, watched=[], watchedDates={}, favs=[], epWatched={};
let active=null, cur={t:0,d:0,state:-1,yt:false}, playing=false, lastId=null, idleT, ssT, osdT, nextAvail=false, uiT, wl=null;
let hls = null;

const prog=k=>progress[k]||{t:0,d:0};
const keyOf=m=>m.episodes&&m.episodes.length?m.id+'#'+(progress['ep:'+m.id]|0):m.id;
let appInited = false;
let currentUser = null;

/* ---------- Sincronización ---------- */
function syncProgress() {
  if(!currentUser) return;
  const pCol = db.collection('users').doc(currentUser.uid).collection('progress');
  Object.keys(progress).forEach(k => {
    if(progress[k] && progress[k].t > 10) pCol.doc(k).set({...progress[k], updatedAt: firebase.firestore.FieldValue.serverTimestamp()}).catch(console.error);
  });
}
function syncWatched(id, isWatched) {
  if(!currentUser) return;
  const ref = db.collection('users').doc(currentUser.uid).collection('watched').doc(id);
  isWatched ? ref.set({watchedAt: firebase.firestore.FieldValue.serverTimestamp()}).catch(console.error) : ref.delete().catch(console.error);
}
function syncFav(id, isFav) {
  if(!currentUser) return;
  const ref = db.collection('users').doc(currentUser.uid).collection('favs').doc(id);
  isFav ? ref.set({addedAt: firebase.firestore.FieldValue.serverTimestamp()}).catch(console.error) : ref.delete().catch(console.error);
}
function syncEpWatched(id, urls) {
  if(!currentUser) return;
  const ref = db.collection('users').doc(currentUser.uid).collection('watched').doc('ep_'+id);
  urls.length ? ref.set({episodes: urls}).catch(console.error) : ref.delete().catch(console.error);
}

/* ---------- Inicialización ---------- */
async function initApp() {
  if (appInited) return;
  appInited = true;
  currentUser = auth.currentUser;

  db.collection('movies').onSnapshot(snap => {
    all = [];
    snap.forEach(d => { const m = d.data(); if(m.visible!==false && !m.deleted) all.push({id:d.id, ...m, createdAt:millis(m.createdAt)}) });
    initGenres(); if(!playing) render();
  }, err => { console.error(err); if(!all.length) $('mainCatalog').innerHTML = '<div style="padding:20px">Error al cargar catálogo.</div>'; });

  const uid = currentUser.uid;
  db.collection('users').doc(uid).collection('progress').onSnapshot(snap => {
    snap.forEach(d => { progress[d.id] = d.data() }); if(!playing) render();
  });
  db.collection('users').doc(uid).collection('watched').onSnapshot(snap => {
    watched = []; watchedDates = {}; epWatched = {};
    snap.forEach(d => {
      if(d.id.startsWith('ep_')) epWatched[d.id.replace('ep_','')] = d.data().episodes || [];
      else { watched.push(d.id); watchedDates[d.id] = millis(d.data().watchedAt); }
    });
    if(!playing) render();
  });
  db.collection('users').doc(uid).collection('favs').onSnapshot(snap => {
    favs = []; snap.forEach(d => favs.push(d.id)); if(!playing) render();
  });

  document.querySelectorAll('.btn-filter').forEach(b=>b.onclick=()=>{
    filter=b.dataset.cat; document.querySelectorAll('.btn-filter').forEach(x=>x.classList.toggle('active',x===b));
    $('searchInput').value=''; search(); render();
  });

  const savedFilter = sessionStorage.getItem('cs_filter');
  if (savedFilter) { const btn = document.querySelector(`.btn-filter[data-cat="${savedFilter}"]`); if (btn) btn.click(); }

  let searchT;
  $('searchInput').oninput=()=>{ clearTimeout(searchT); searchT=setTimeout(search, 200); };
  $('genreSel').onchange=e=>{genre=e.target.value;render()};
  $('lenSel').onchange=e=>{maxLen=+e.target.value;render()};
  $('btnClose').onclick=closeModal;
  $('btnInfo').onclick=()=>active&&openInfo(active.m);
  $('btnReport').onclick=()=>{
    if(!active)return;
    fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:active.m.id})})
      .then(r=>osd(r.ok?'🚩 Gracias, aviso enviado':'⚠ No se pudo enviar'))
      .catch(()=>osd('⚠ No se pudo enviar'));
  };
  $('btnNextEp').onclick=()=>nextEp();
  $('btnEnh').onclick=()=>{enh=(enh+1)%3;try{localStorage.setItem('cs_enh',enh)}catch{}applyEnh();osd('✨ Imagen: '+ENH_NAMES[enh])};

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
      $('btnVoice').style.display = 'block';
      const recognition = new SR();
      recognition.lang = 'es-ES'; recognition.interimResults = false;
      recognition.onstart = () => $('btnVoice').classList.add('listening');
      recognition.onend = () => $('btnVoice').classList.remove('listening');
      recognition.onresult = (event) => { $('searchInput').value = event.results[0][0].transcript; search(); };
      $('btnVoice').onclick = () => { try { recognition.start(); } catch(e) { osd('⚠ Voz no disponible'); } };
  }

  if(IS_MOBILE) initMobile();

  addEventListener('keydown', handleKeydown);
  addEventListener('mousemove',()=>{resetIdle();if(playing)showUi()});
  addEventListener('touchstart',()=>{if(playing)showUi()},{passive:true});
  addEventListener('popstate',()=>{if(playing)endPlayback();else if(modalOpen())hideModal()});
  addEventListener('message',handleYtMessage);
  setInterval(()=>{if(playing)saveProgress()},5000);

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab' || !modalOpen()) return;
    const focusables = [...$('detailModal').querySelectorAll('button, [href], input, select, [tabindex]:not([tabindex="-1"])')].filter(el => el.getClientRects().length);
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  resetIdle();
}

/* ---------- Render ---------- */
function render(){
  sessionStorage.setItem('cs_filter', filter);
  const box=$('mainCatalog');box.replaceChildren();
  if(!all.length){box.textContent='Aún no hay títulos en el catálogo.';return}
  let list=filter==='Vistos'?all.filter(m=>watched.includes(m.id)):filter==='Lista'?all.filter(m=>favs.includes(m.id)):filter==='Pendientes'?all.filter(m=>!watched.includes(m.id)):filter==='All'?all:all.filter(m=>m.category===filter);
  if(genre)list=list.filter(m=>(m.genres||[]).includes(genre));
  if(maxLen)list=list.filter(m=>m.runtime&&m.runtime<=maxLen);
  hero(list);

  const recent = [...watched].sort((a,b) => (watchedDates[b]||0) - (watchedDates[a]||0)).slice(0, 10).map(id => all.find(m => m.id === id)).filter(Boolean);
  section('Vistos recientemente', recent);

  section('Continuar viendo',list.filter(m=>prog(keyOf(m)).t>10&&!watched.includes(m.id)));
  if(filter==='All')section('⭐ Mi lista',list.filter(m=>favs.includes(m.id)));
  section('Añadidos recientemente',[...list].sort((a,b)=>millis(b.createdAt)-millis(a.createdAt)).slice(0,10));
  CATS.forEach(([c,l])=>{if(!['Película','Serie','Documental'].includes(filter)||filter===c)section(l,list.filter(m=>m.category===c))});
  const byCol={};list.forEach(m=>{if(m.collection)(byCol[m.collection]=byCol[m.collection]||[]).push(m)});
  Object.keys(byCol).sort().forEach(n=>{if(byCol[n].length>1)section('🎬 '+n,byCol[n].sort((a,b)=>(a.year||0)-(b.year||0)))});
  [...new Set(list.flatMap(m=>m.tags||[]))].sort().forEach(t=>section('★ '+t,list.filter(m=>(m.tags||[]).includes(t))));
}
function section(title,items){
  if(!items.length)return;
  const row=h('div',{className:'carousel'});items.forEach(m=>row.append(card(m)));
  $('mainCatalog').append(h('div',{className:'section'},h('h2',{className:'section-title',textContent:title,style:'margin:0 0 12px;font-size:1.25rem'}),row));
}
function card(m){
  const p=prog(keyOf(m)),pct=p.d?Math.min(100,p.t/p.d*100):0;
  const smallPoster = (m.poster||'').replace('/w500/','/w185/');
  const img=h('img',{className:'card-poster',src:m.poster||PH,srcset:smallPoster?`${smallPoster} 185w, ${m.poster} 500w`:'',sizes:'170px',alt:m.title||'',loading:'lazy',width:170,height:240});
  img.onerror=()=>{img.onerror=null;img.src=PH};
  const c=h('div',{className:'card',tabIndex:0},h('span',{className:'badge-c',textContent:m.category||'Peli'}),img);
  if(watched.includes(m.id))c.append(h('div',{className:'badge-w',textContent:'✓'}));
  if(favs.includes(m.id))c.append(h('span',{className:'badge-f',textContent:'⭐'}));
  if(m.episodes&&m.episodes.length)c.append(h('span',{className:'badge-n',textContent:`${(epWatched[m.id]||[]).filter(u=>m.episodes.some(e=>e.url===u)).length}/${m.episodes.length}`}));
  if(m.lang||m.quality)c.append(h('span',{className:'badge-q',textContent:[m.lang,m.quality].filter(Boolean).join(' · ')}));
  if(pct>1)c.append(h('div',{className:'pbar'})),c.lastChild.style.width=pct+'%';
  c.append(h('div',{className:'card-title',textContent:m.title||''}));
  c.dataset.id=m.id;
  c.onclick=()=>start(m);
  c.onfocus=()=>c.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});
  return c;
}
function focusCard(id){const c=document.querySelector('.card[data-id="'+id+'"]')||document.querySelector('.card');c&&c.focus()}
function search(){
  const q=norm($('searchInput').value.trim()),r=$('searchResults');
  if(!q){r.style.display='none';$('mainCatalog').style.display='block';render();return}
  const has=a=>Array.isArray(a)&&a.some(x=>norm(x).includes(q));
  const res=all.filter(m=>norm(m.title).includes(q)||norm(m.director).includes(q)||has(m.cast)||has(m.genres)||has(m.tags));
  r.replaceChildren(...(res.length?res.map(card):[h('div',{textContent:'Sin resultados.',style:'padding:20px'})]));
  $('mainCatalog').style.display='none';$('hero').style.display='none';r.style.display='flex';
}
function initGenres(){
  const g=[...new Set(all.flatMap(m=>m.genres||[]))].sort(),s=$('genreSel');
  s.replaceChildren(h('option',{value:'',textContent:'Todos los géneros'}),...g.map(x=>h('option',{value:x,textContent:x})));
  s.value=g.includes(genre)?genre:'';
}
function searchBy(n){
  if(playing){osd('Cierra el reproductor para buscar');return}
  closeModal();
  setTimeout(()=>{$('searchInput').value=n;search();window.scrollTo({top:0});const c=document.querySelector('#searchResults .card');c?c.focus():$('searchInput').focus()},150);
}
function hero(list){
  const el=$('hero'),pool=list.filter(m=>m.poster&&m.overview&&!watched.includes(m.id));
  if(filter!=='All'||genre||!pool.length){el.style.display='none';return}
  const cont=pool.find(m=>prog(keyOf(m)).t>10),m=cont||pool[Math.floor(Date.now()/864e5)%pool.length];
  const bg=h('div',{className:'hero-bg'});bg.style.backgroundImage='url('+JSON.stringify(m.poster)+')';
  const play=h('button',{id:'heroPlay',className:'btn-action btn-play',textContent:cont?'▶ Continuar viendo':'▶ Reproducir',onclick:()=>start(m)});
  const info=h('button',{className:'btn-action',textContent:'ℹ Info',onclick:()=>{lastId=m.id;openInfo(m)}});
  el.replaceChildren(bg,h('div',{className:'hero-in'},h('img',{src:m.poster,alt:''}),
    h('div',{},h('h2',{textContent:m.title||''}),h('p',{textContent:m.overview}),play,info)));
  el.style.display='block';
}

/* ---------- Modal, episodios y reproducción ---------- */
let selSeason=null,selFor=null;
function seasonOf(e){return (String(e.title||'').match(/^\s*(\d+)\s*[x×]/i)||[])[1]||'0'}
function isEpSeen(m,e){return (epWatched[m.id]||[]).includes(e.url)}
function toggleEpSeen(m,e,val){
  const eps=m.episodes||[],s=new Set(epWatched[m.id]||[]);
  if(val===undefined?!s.has(e.url):val)s.add(e.url);else s.delete(e.url);
  epWatched[m.id]=[...s]; syncEpWatched(m.id, epWatched[m.id]);
  if(!eps.length)return;
  const all=eps.every(x=>s.has(x.url));
  if(all&&!watched.includes(m.id)){watched.push(m.id);syncWatched(m.id, true);}
  if(!all&&watched.includes(m.id)){watched=watched.filter(i=>i!==m.id);syncWatched(m.id, false);}
}
function contIdx(m){
  const eps=m.episodes||[],cur=Math.min(progress['ep:'+m.id]|0,eps.length-1);
  if(!isEpSeen(m,eps[cur]))return cur;
  for(let i=cur+1;i<eps.length;i++)if(!isEpSeen(m,eps[i]))return i;
  for(let i=0;i<eps.length;i++)if(!isEpSeen(m,eps[i]))return i;
  return cur;
}
function setContinue(m){
  const eps=m.episodes||[],b=$('btnPlay');
  if(eps.length){
    const ci=contIdx(m),pp=prog(m.id+'#'+ci),fresh=!(epWatched[m.id]||[]).length&&pp.t<=10&&ci===0;
    b.textContent=(fresh?'▶ Empezar: ':'▶ Continuar: ')+(eps[ci].title||'Episodio '+(ci+1))+(pp.t>30?' · desde el min '+Math.floor(pp.t/60):'');
    b.onclick=()=>play(m,ci);
  }else{
    const p=prog(keyOf(m));
    b.textContent=p.t>30?'▶ Reanudar desde '+Math.floor(p.t/60)+'m':'▶ Reproducir';
    b.onclick=()=>play(m);
  }
}
function renderEpisodes(m,focusIdx){
  const eps=m.episodes||[],box=$('mEps');box.replaceChildren();
  if(!eps.length)return;
  const seasons=[...new Set(eps.map(seasonOf))].sort((a,b)=>a-b),cur=contIdx(m);
  if(selFor!==m.id||!seasons.includes(selSeason)){selFor=m.id;selSeason=seasonOf(eps[Math.min(cur,eps.length-1)])}
  if(seasons.length>1){
    box.append(h('div',{},...seasons.map(s=>{
      const list=eps.filter(e=>seasonOf(e)===s),seen=list.filter(e=>isEpSeen(m,e)).length;
      return h('button',{className:'chip',style:s===selSeason?'background:var(--accent);border-color:var(--accent)':'',
        textContent:(s==='0'?'Episodios':'Temporada '+s)+` (${seen}/${list.length})`,
        onclick:()=>{selSeason=s;renderEpisodes(m);const b=$('mEps').querySelector('.btn-action');b&&b.focus()}});
    })));
  }
  eps.forEach((e,i)=>{
    if(seasonOf(e)!==selSeason)return;
    const seen=isEpSeen(m,e);
    box.append(h('div',{style:'display:flex;gap:6px;align-items:stretch'},
      h('button',{className:'btn-action',style:'flex:1'+(seen?';opacity:.7':''),textContent:(i===cur?'● ':'▶ ')+(seen?'✓ ':'')+(e.title||'Episodio '+(i+1)),onclick:()=>play(m,i)}),
      h('button',{className:'btn-action tg',style:'width:auto;flex:none',title:seen?'Marcar como no visto':'Marcar como visto',textContent:seen?'↺':'✓',
        onclick:()=>{toggleEpSeen(m,e);renderEpisodes(m,i);if(!playing)render()}})));
  });
  setContinue(m);
  if(focusIdx!=null){const t=[...box.querySelectorAll('.tg')].find(x=>x.onclick&&x.parentNode.firstChild.textContent.includes(eps[focusIdx].title||''));t&&t.focus()}
}
const modalOpen=()=>$('detailModal').style.display==='flex';
function openInfo(m){
  $('mTitle').textContent=m.title||'';
  $('mPoster').src=m.poster||PH;
  $('mPoster').alt=m.title||'';

  // Meta: año · duración · clasificación · nota · idioma · calidad · géneros
  const meta = [];
  if (m.year) meta.push(m.year);
  if (m.runtime) meta.push(m.runtime + ' min');
  if (m.ageRating) meta.push(m.ageRating);
  if (m.rating) meta.push('★ ' + m.rating);
  if (m.lang) meta.push(m.lang);
  if (m.quality) meta.push(m.quality);
  if (m.genres && m.genres.length) meta.push(...m.genres);
  $('mMeta').replaceChildren(...meta.map(x => h('span', {textContent:x})));

  $('mOverview').textContent = m.overview || 'Sin descripción disponible.';

  const chips=(el,names)=>{
    names = names.map(s=>String(s).trim()).filter(x=>x&&x!=='Desconocido');
    if (names.length) el.replaceChildren(...names.map(n=>h('button',{className:'chip',textContent:n,onclick:()=>searchBy(n)})));
    else el.textContent='—';
  };
  chips($('mDirector'), String(m.director||'').split(','));
  chips($('mCast'), Array.isArray(m.cast) ? m.cast : String(m.cast||'').split(','));

  const eps=m.episodes||[],box=$('mEps');box.replaceChildren();
  renderEpisodes(m);
  setContinue(m);

  if (m.tmdbId) {
    $('mRecs').innerHTML = '<div style="color:var(--muted);font-size:.8rem;margin-top:15px">Buscando recomendaciones...</div>';
    api('tmdb', { mode: 'recommendations', id: m.tmdbId, type: m.category === 'Serie' ? 'tv' : 'movie' })
      .then(recs => {
        if(!recs || !recs.length) { $('mRecs').innerHTML = ''; return; }
        $('mRecs').innerHTML = '<h3 style="font-size:1rem;margin-top:20px;margin-bottom:10px">Recomendaciones</h3>';
        const row = h('div', {className: 'carousel', style: 'gap:10px;padding:0'});
        recs.slice(0, 6).forEach(r => {
          const img = h('img', {src: r.poster || PH, style: 'width:80px;height:120px;object-fit:cover;border-radius:6px;cursor:pointer', title: r.title});
          img.onclick = () => searchBy(r.title);
          row.append(img);
        });
        $('mRecs').appendChild(row);
      }).catch(() => $('mRecs').innerHTML = '');
  } else { $('mRecs').innerHTML = ''; }

  const f=$('btnFav');f.textContent=favs.includes(m.id)?'★ Quitar de Mi lista':'☆ Añadir a Mi lista';
  f.onclick=()=>{favs=favs.includes(m.id)?favs.filter(i=>i!==m.id):[...favs,m.id];syncFav(m.id, favs.includes(m.id));openInfo(m);if(!playing)render()};
  const w=$('btnWatched');w.textContent=watched.includes(m.id)?'✕ Marcar como no visto':'✓ Marcar como visto';
  w.onclick=()=>{watched=watched.includes(m.id)?watched.filter(i=>i!==m.id):[...watched,m.id];syncWatched(m.id, watched.includes(m.id));
    if(m.episodes&&m.episodes.length){epWatched[m.id]=watched.includes(m.id)?m.episodes.map(e=>e.url):[];syncEpWatched(m.id, epWatched[m.id])}
    openInfo(m);if(!playing)render()};

  if(!modalOpen()){
    sessionStorage.setItem('cs_scrollY', window.scrollY);
    history.pushState({m:1},''); $('detailModal').style.display='flex';
  }
  $('btnPlay').focus();
}
function hideModal(){
  $('detailModal').style.display='none';
  if(!playing) {
      focusCard(lastId);
      const savedY = sessionStorage.getItem('cs_scrollY');
      if (savedY) window.scrollTo(0, parseInt(savedY));
  }
}
function closeModal(){history.state&&history.state.m?history.back():hideModal()}

function embedUrl(raw,start){
  const u=raw.trim();let m;
  if(/tokyvideo\.com\/(?:\w\w\/)?video\//.test(u))return{bad:'Este enlace es la página de TokyVideo, no el reproductor.'};
  if(m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/))
    return{yt:true,url:`https://www.youtube.com/embed/${m[1]}?autoplay=1&enablejsapi=1&rel=0&start=${Math.floor(start)}`};
  if(m=u.match(/(?:vk\.com|vk\.ru|vkvideo\.ru)\/video(-?\d+)_(\d+)/))return{url:`https://vk.ru/video_ext.php?oid=${m[1]}&id=${m[2]}&hd=2&autoplay=1`};
  if(/video_ext\.php\?/.test(u))return{url:u+(/autoplay=/.test(u)?'':'&autoplay=1')};
  if(m=u.match(/ok\.ru\/(?:video|videoembed)\/(\d+)/))return{url:`https://ok.ru/videoembed/${m[1]}?autoplay=1`};
  if(m=u.match(/(?:dailymotion\.com\/(?:embed\/)?video\/|dai\.ly\/)(\w+)/))return{url:`https://www.dailymotion.com/embed/video/${m[1]}?autoplay=1`};
  if(!/rumble\.com\/embed\//.test(u)&&(m=u.match(/rumble\.com\/(v[a-z0-9]+)-/)))return{url:`https://rumble.com/embed/${m[1]}/`};
  if(u.endsWith('.m3u8')) return {hls:true, url:u};
  return{url:u};
}
function start(m){lastId=m.id;if(m.episodes&&m.episodes.length){openInfo(m);return}play(m)}

function play(m,ep){
  const eps=m.episodes||[];
  if(eps.length)ep=ep==null?(progress['ep:'+m.id]|0):ep;
  const src=eps.length?eps[ep]:m;
  if(!src||!src.url){alert('El enlace del vídeo no está disponible.');return}
  const e=embedUrl(src.url,0);
  if(e.bad){alert(e.bad);return}

  saveProgress(true);
  if(eps.length)progress['ep:'+m.id]=ep;
  active={m,ep,key:eps.length?m.id+'#'+ep:m.id};
  const p=prog(active.key),from=p.d&&p.t>p.d-30?0:p.t;

  const playerIframe = $('videoPlayer');
  const playerHls = $('hlsPlayer');

  if (e.hls) {
      playerIframe.style.display = 'none';
      playerHls.style.display = 'block';
      playerHls.src = e.url;
      if (Hls.isSupported()) {
          if(hls) hls.destroy();
          hls = new Hls();
          hls.loadSource(e.url);
          hls.attachMedia(playerHls);
          hls.on(Hls.Events.MANIFEST_PARSED, () => { playerHls.play(); });
      } else if (playerHls.canPlayType('application/vnd.apple.mpegurl')) {
          playerHls.src = e.url;
          playerHls.addEventListener('loadedmetadata', () => { playerHls.play(); });
      }
      cur = {t:0, d:0, state:-1, yt:false};
  } else {
      if(hls) { hls.destroy(); hls = null; }
      playerHls.style.display = 'none';
      playerIframe.style.display = 'block';

      const embed = embedUrl(src.url, from);
      cur = {t:from, d:p.d, state:-1, yt:!!embed.yt};
      playerIframe.onload = () => { if(cur.yt) playerIframe.contentWindow.postMessage('{"event":"listening","id":1,"channel":"widget"}','*') };
      playerIframe.src = embed.url;
  }

  applyEnh();
  const w=$('playerWrapper'); w.style.display='block';
  const fs=(!IS_MOBILE&&w.requestFullscreen)&&w.requestFullscreen(); fs&&fs.catch&&fs.catch(()=>{});
  w.focus(); window.scrollTo({top:0});
  playing=true; resetIdle(); document.body.classList.add('playing');
  if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(l=>{wl=l}).catch(()=>{});
  UI_IDS.forEach(i=>$(i).style.display='none');
  const sn=!eps.length&&sagaNext(m);
  $('btnNextEp').textContent=sn?'▶ Siguiente de la saga':'▶ Siguiente episodio';
  nextAvail=!!((eps.length&&ep+1<eps.length)||sn); $('btnNextEp').style.display='none';
  osd('▶ Reproduciendo',m.title+(eps.length?' · '+(src.title||'Episodio '+(ep+1)):''));
}

function sagaNext(m){
  if(!m.collection)return null;
  const s=all.filter(x=>x.collection===m.collection).sort((a,b)=>(a.year||0)-(b.year||0)),i=s.findIndex(x=>x.id===m.id);
  return i>=0?s[i+1]||null:null;
}
function nextEp(){
  const m=active.m,eps=m.episodes||[];
  if(eps.length)toggleEpSeen(m,eps[active.ep],true);
  if(eps.length&&active.ep+1<eps.length)return play(m,active.ep+1);
  if(!eps.length&&!watched.includes(m.id)){watched.push(m.id);syncWatched(m.id, true);}
  delete progress[active.key]; syncProgress();
  const nx=!eps.length&&sagaNext(m);if(nx)return play(nx);
  stopVideo();
}
const UI_IDS=['btnInfo','btnReport','btnEnh'];
const rawEnh=(()=>{try{return localStorage.getItem('cs_enh')}catch{return null}})();
let enh=rawEnh===null?1:+rawEnh;
const ENH_NAMES=['Original','Suave','Nítida'];
function applyEnh(){
  const f=$('videoPlayer'), v=$('hlsPlayer');
  [f,v].forEach(el => {
      el.classList.toggle('enh1',enh===1);
      el.classList.toggle('enh2',enh===2);
  });
  $('btnEnh').textContent='✨ Imagen: '+ENH_NAMES[enh];
}
function showUi(){
  if(!playing)return;
  UI_IDS.forEach(i=>$(i).style.display='block');
  if(nextAvail)$('btnNextEp').style.display='block';
  clearTimeout(uiT);uiT=setTimeout(hideUi,4000);
}
function hideUi(){
  const a=document.activeElement;
  if(a&&[...UI_IDS,'btnNextEp'].includes(a.id)) $('playerWrapper').focus();
  [...UI_IDS,'btnNextEp'].forEach(i=>$(i).style.display='none');
}
function osd(status,title){
  $('osdStatus').textContent=status;if(title)$('osdTitle').textContent=title;
  $('osdFill').style.width=cur.d?Math.min(100,cur.t/cur.d*100)+'%':'0';
  $('osd').style.display='flex';clearTimeout(osdT);osdT=setTimeout(()=>$('osd').style.display='none',3000);
}
const yt=(func,args)=>$('videoPlayer').contentWindow.postMessage(JSON.stringify({event:'command',func,args:args||''}),'*');

let lastSavedTime = 0;
function saveProgress(force) {
  if(!active) return;
  if ($('hlsPlayer').style.display === 'block') {
      cur.t = $('hlsPlayer').currentTime;
      cur.d = $('hlsPlayer').duration;
  }
  if(cur.d&&cur.t/cur.d>0.9&&(active.m.episodes||[]).length)toggleEpSeen(active.m,active.m.episodes[active.ep],true);
  if(cur.t>10){
    if(!force && Math.abs(Math.floor(cur.t) - lastSavedTime) < 5) return;
    progress[active.key]={t:Math.floor(cur.t),d:Math.floor(cur.d)};
    syncProgress(); lastSavedTime = Math.floor(cur.t);
  }
}
function handleYtMessage(e){
  if(!playing||e.origin!=='https://www.youtube.com')return;
  let d;try{d=typeof e.data==='string'?JSON.parse(e.data):e.data}catch{return}
  if(!d||d.event!=='infoDelivery'||!d.info)return;
  if(d.info.currentTime!=null)cur.t=d.info.currentTime;
  if(d.info.duration)cur.d=d.info.duration;
  if(d.info.playerState!=null){cur.state=d.info.playerState;if(cur.state===0)nextEp()}
}
function seek(s){
  if($('hlsPlayer').style.display === 'block') {
      $('hlsPlayer').currentTime += s;
      osd(s<0?'⏪ -10 s':'⏩ +10 s');
  } else if(cur.yt) {
      cur.t=Math.max(0,cur.t+s); yt('seekTo',[cur.t,true]); osd(s<0?'⏪ -10 s':'⏩ +10 s');
  } else {
      osd('⚠ Salto no disponible en este servidor');
  }
}
function togglePause(){
  if($('hlsPlayer').style.display === 'block') {
      if($('hlsPlayer').paused) $('hlsPlayer').play(); else $('hlsPlayer').pause();
  } else if(cur.yt) {
      if(cur.state===1){yt('pauseVideo');osd('⏸ Pausa')}else{yt('playVideo');osd('▶ Reproduciendo')}
  } else {
      osd('⚠ Pausa no disponible');
  }
}
function endPlayback(){
  saveProgress(true);
  $('videoPlayer').src='';
  $('hlsPlayer').pause(); $('hlsPlayer').src='';
  if(hls) { hls.destroy(); hls = null; }

  $('playerWrapper').style.display='none';
  ['osd','btnInfo','btnReport','btnEnh','btnNextEp'].forEach(i=>$(i).style.display='none');
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
  playing=false;active=null;document.body.classList.remove('playing');if(wl){wl.release().catch(()=>{});wl=null}resetIdle();render();focusCard(lastId);
}
function stopVideo(){history.state&&history.state.p?history.back():endPlayback()}

const IS_MOBILE=matchMedia('(max-width:900px)').matches&&navigator.maxTouchPoints>0;
function initMobile(){
  document.body.classList.add('mobile');
  const nav=h('nav',{className:'mnav'});
  const mark=()=>nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.cat===filter));
  [['All','🏠','Inicio'],['Película','🎬','Películas'],['Serie','📺','Series'],['Lista','⭐','Mi lista'],['Vistos','✓','Vistos']].forEach(([cat,ic,lb])=>{
    const b=h('button',{onclick:()=>{document.querySelector('.btn-filter[data-cat="'+cat+'"]').click();window.scrollTo({top:0});mark()}},h('b',{textContent:ic}),lb);
    b.dataset.cat=cat;nav.append(b);
  });
  document.body.append(nav);mark();
  $('playerWrapper').after(h('div',{className:'mbar'},
    h('button',{textContent:'⏪ 10 s',onclick:()=>seek(-10)}),
    h('button',{textContent:'10 s ⏩',onclick:()=>seek(10)}),
    h('button',{textContent:'⏭ Siguiente',onclick:()=>{if(nextAvail)nextEp()}}),
    h('button',{textContent:'ℹ Info',onclick:()=>{if(active)openInfo(active.m)}}),
    h('button',{textContent:'✨ Imagen',onclick:()=>$('btnEnh').click()}),
    h('button',{textContent:'🚩 Caído',onclick:()=>$('btnReport').click()}),
    h('button',{textContent:'✕ Cerrar',onclick:stopVideo})));
}
function resetIdle(){
  clearTimeout(idleT);clearInterval(ssT);$('screensaver').style.display='none';
  if(!playing)idleT=setTimeout(()=>{
    const posters=all.filter(m=>m.poster);if(!posters.length||playing)return;
    $('screensaver').style.display='flex';
    const next=()=>{const i=$('ssImg');i.style.opacity=0;setTimeout(()=>{i.src=posters[Math.floor(Math.random()*posters.length)].poster;i.style.opacity=1},500)};
    next();ssT=setInterval(next,6000);
  },300000);
}
function move(dir){
  const modal=modalOpen(),cur0=document.activeElement;
  const items=[...document.querySelectorAll(modal?'#detailModal button':'.btn-filter,#searchInput,#genreSel,#lenSel,.hero button,.card')].filter(e=>e.getClientRects().length);
  if(!items.includes(cur0)){items[0]&&items[0].focus();return}
  const r=cur0.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bd=Infinity;
  for(const el of items){
    if(el===cur0)continue;const b=el.getBoundingClientRect(),dx=b.left+b.width/2-cx,dy=b.top+b.height/2-cy;
    const ok=dir==='ArrowRight'?dx>5:dir==='ArrowLeft'?dx<-5:dir==='ArrowDown'?dy>5:dy<-5;
    if(!ok)continue;
    const d=(dir==='ArrowLeft'||dir==='ArrowRight')?Math.abs(dx)+Math.abs(dy)*3:Math.abs(dy)+Math.abs(dx)*3;
    if(d<bd){bd=d;best=el}
  }
  best&&best.focus();
}
const isBack=e=>['Escape','Backspace','BrowserBack','GoBack'].includes(e.key)||[4,27,8,10009].includes(e.keyCode);
function handleKeydown(e){
  const ssOn=$('screensaver').style.display==='flex';resetIdle();
  if(ssOn){e.preventDefault();return}
  const a=document.activeElement,typing=a===$('searchInput');
  if(isBack(e)&&!(typing&&e.key==='Backspace')){
    if(playing){e.preventDefault();stopVideo()}
    else if(modalOpen()){e.preventDefault();closeModal()}
    else if(typing)a.blur();
    return;
  }
  if((e.key==='i'||e.key==='ContextMenu'||e.key==='Info')&&!typing){
    e.preventDefault();
    const m=playing?active.m:(a.dataset&&a.dataset.id&&all.find(x=>x.id===a.dataset.id));
    if(m){lastId=m.id;openInfo(m)}return;
  }
  const arrows=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
  if(playing&&!modalOpen()){
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();seek(e.key==='ArrowLeft'?-10:10)}
    else if(e.key==='ArrowUp'){e.preventDefault();showUi();const i=UI_IDS.indexOf(a&&a.id);$(UI_IDS[(i+1)%UI_IDS.length]).focus()}
    else if(e.key==='ArrowDown'&&nextAvail){e.preventDefault();showUi();$('btnNextEp').focus()}
    else if(e.key===' '||e.key==='MediaPlayPause'||e.keyCode===179||(e.key==='Enter'&&a.tagName!=='BUTTON')){e.preventDefault();togglePause()}
    else if(e.key==='MediaTrackNext')nextEp();
    return;
  }
  if(arrows.includes(e.key)){
    if(a.tagName==='SELECT')return;
    if(typing&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;
    e.preventDefault();move(e.key);
  }else if(e.key==='Enter'&&a.classList&&a.classList.contains('card')){e.preventDefault();a.click()}
}
</script>
